# Producción detrás de un túnel de Cloudflare (alternativa a Tailscale, D-034).
#
# La aplicación NO publica ningún puerto en el anfitrión: el único camino de
# entrada es el túnel, que abre una conexión SALIENTE hacia la red de
# Cloudflare. El router no expone ningún puerto y la IP del servidor no se
# publica (decisión D-010, luego matizada por D-034).
#
# Uso:
#   TUNEL=cloudflare ./scripts/deploy.sh
services:
  db:
    image: postgres:17-alpine
    container_name: trauma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta}
      POSTGRES_DB: ${POSTGRES_DB:?falta}
      LANG: es_ES.UTF-8
    volumes:
      - datos-db:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]
    logging: &registro
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: plataforma-trauma:local
    container_name: trauma-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?falta}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?falta}
      NODE_ENV: production
      TZ: ${TZ:-America/Santiago}
      RESPALDOS_DIR: /backups
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_DESDE: ${SMTP_DESDE:-}
    volumes:
      - medios:/app/medios
      - ./backups:/backups
    networks: [interna]
    logging: *registro

  # Túnel de Cloudflare. Hace falta uno solo por servidor, no uno por servicio:
  # los demás servicios se agregan como nombres públicos en el panel de
  # Cloudflare apuntando a su dirección interna. Ver docs/CLOUDFLARE.md
  #
  # Para alcanzar servicios que corren FUERA de este compose, apuntar en el
  # panel a http://anfitrion:PUERTO gracias al extra_hosts de abajo.
  tunel:
    image: cloudflare/cloudflared:latest
    container_name: trauma-tunel
    restart: unless-stopped
    depends_on: [app]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?falta}
    extra_hosts:
      - "anfitrion:host-gateway"
    networks: [interna]
    logging: *registro
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  datos-db:
  medios:

networks:
  interna:
    driver: bridge
