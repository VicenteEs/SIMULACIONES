       body:{es:"Carrera progresiva una vez consolidada la fractura y con marcha simétrica. Pliometría de bajo a alto impacto, cambios de dirección y gestos específicos de la actividad laboral o deportiva. Evaluación isocinética o con dinamometría manual cuando esté disponible.",
             en:"Progressive running once the fracture is united and gait is symmetric. Low to high impact plyometrics, change of direction and sport or work-specific tasks. Isokinetic or handheld dynamometry assessment when available."},
       crit:{es:"Índice de simetría de extremidades superior al 90% en fuerza y en pruebas de salto unipodal.",en:"Limb symmetry index above 90% in strength and single-leg hop testing."}}
    ],
    media:[{es:"Marcha asistida y progresión de carga",en:"Assisted gait and weight-bearing progression"},
           {es:"Movilización patelar y ganancia de flexión",en:"Patellar mobilisation and flexion gain"},
           {es:"Progresión de fortalecimiento en cadena cerrada",en:"Closed-chain strengthening progression"}]
  }
},
{
  id:"radio-distal", region:"mano", kind:"trauma", code:"23", full:true,
  name:{es:"Fractura de radio distal", en:"Distal radius fracture"},
  sub:{es:"La fractura más frecuente de la extremidad superior", en:"The most common upper limb fracture"},
  def:{
    es:`<h4>Definición</h4><p>Fractura del extremo distal del radio, dentro del cuadrado que delimita la clasificación AO/OTA. Concentra alrededor de una sexta parte de las fracturas atendidas en urgencia y presenta la misma distribución bimodal del resto de las fracturas por fragilidad.</p>
    <h4>Mecanismo</h4><ul>
    <li><b>Caída sobre la mano extendida</b> con muñeca en extensión, que produce el patrón de desplazamiento dorsal clásicamente descrito por Colles.</li>
    <li><b>Caída con muñeca en flexión</b>, que genera desplazamiento volar y suele ser inestable.</li>
    <li><b>Alta energía en el paciente joven</b>, con compromiso articular, impactación metafisaria y lesión ligamentosa asociada del carpo.</li></ul>
    <h4>Por qué importa el detalle</h4><p>El resultado funcional depende menos del nombre propio de la fractura que de tres variables medibles: la restitución de la anatomía radiocarpiana, la congruencia de la articulación radiocubital distal y la ausencia de escalón articular.</p>`,
    en:`<h4>Definition</h4><p>Fracture of the distal end of the radius, within the square defined by the AO/OTA classification. It accounts for around one sixth of fractures seen in the emergency department and shows the same bimodal distribution as other fragility fractures.</p>
    <h4>Mechanism</h4><ul>
    <li><b>Fall on the outstretched hand</b> with the wrist extended, producing the dorsal displacement pattern classically described by Colles.</li>
    <li><b>Fall with the wrist flexed</b>, producing volar displacement, usually unstable.</li>
    <li><b>High energy in the young patient</b>, with articular involvement, metaphyseal impaction and associated carpal ligament injury.</li></ul>
    <h4>Why the detail matters</h4><p>Functional outcome depends less on the eponym than on three measurable variables: restoration of radiocarpal anatomy, congruence of the distal radioulnar joint and absence of an articular step-off.</p>`},
  classif:{
    box:{
      title:{es:"AO/OTA 23 · radio distal", en:"AO/OTA 23 · distal radius"},
      rows:[
        {k:"23-A", v:{es:"Extraarticular. A2 simple impactada, A3 multifragmentaria.", en:"Extra-articular. A2 simple impacted, A3 multifragmentary."}},
        {k:"23-B", v:{es:"Articular parcial. B1 sagital, B2 dorsal (Barton dorsal), B3 volar (Barton volar).", en:"Partial articular. B1 sagittal, B2 dorsal (dorsal Barton), B3 volar (volar Barton)."}},
        {k:"23-C", v:{es:"Articular completa. C1 simple articular y metafisaria, C2 simple articular con metáfisis multifragmentaria, C3 articular multifragmentaria.", en:"Complete articular. C1 simple articular and metaphyseal, C2 simple articular with multifragmentary metaphysis, C3 multifragmentary articular."}}
      ]
    },
    es:`<h4>Clasificación de Fernández, por mecanismo</h4><ul>
    <li><b>Tipo I</b> flexión metafisaria. <b>Tipo II</b> cizallamiento articular. <b>Tipo III</b> compresión de la superficie articular. <b>Tipo IV</b> avulsión con luxación radiocarpiana. <b>Tipo V</b> combinada de alta energía.</li></ul>
    <p>Es la más útil en la conversación quirúrgica porque cada tipo sugiere directamente una estrategia: reducción y estabilización metafisaria en el I, reducción abierta y fijación con placa de sostén en el II, restitución de la superficie con injerto o sustituto en el III.</p>
    <h4>Parámetros radiológicos de referencia</h4><div class="classbox">
    <div class="classrow"><div class="k code">22°</div><div class="v">Inclinación radial en la proyección posteroanterior.</div></div>
    <div class="classrow"><div class="k code">11 mm</div><div class="v">Altura radial medida desde la punta de la estiloides.</div></div>
    <div class="classrow"><div class="k code">11°</div><div class="v">Inclinación volar en la proyección lateral.</div></div>
    <div class="classrow"><div class="k code">&lt; 2 mm</div><div class="v">Escalón articular máximo tolerado, umbral asociado a artrosis radiocarpiana precoz.</div></div></div>`,
    en:`<h4>Fernández classification, by mechanism</h4><ul>
    <li><b>Type I</b> metaphyseal bending. <b>Type II</b> articular shearing. <b>Type III</b> compression of the articular surface. <b>Type IV</b> avulsion with radiocarpal dislocation. <b>Type V</b> combined high-energy.</li></ul>
    <p>It is the most useful in surgical discussion because each type points directly to a strategy: metaphyseal reduction and stabilisation in I, open reduction with a buttress plate in II, surface restoration with graft or substitute in III.</p>
    <h4>Reference radiographic parameters</h4><div class="classbox">
    <div class="classrow"><div class="k code">22°</div><div class="v">Radial inclination on the posteroanterior view.</div></div>
    <div class="classrow"><div class="k code">11 mm</div><div class="v">Radial height measured from the tip of the styloid.</div></div>
    <div class="classrow"><div class="k code">11°</div><div class="v">Volar tilt on the lateral view.</div></div>
    <div class="classrow"><div class="k code">&lt; 2 mm</div><div class="v">Maximum tolerated articular step-off, the threshold linked to early radiocarpal arthritis.</div></div></div>`},
  evalx:{
    es:`<h4>Examen dirigido</h4><ul>
    <li><b>Nervio mediano.</b> Documentar sensibilidad en pulpejo de índice antes de reducir. El síndrome del túnel carpiano agudo con dolor desproporcionado y parestesia progresiva es indicación de liberación urgente, no de observación.</li>
    <li><b>Articulación radiocubital distal.</b> Prueba de la tecla del piano y estabilidad en pronosupinación. La inestabilidad residual explica gran parte del dolor cubital tardío.</li>
    <li><b>Escafoides y carpo.</b> Palpar tabaquera anatómica: la fractura de escafoides asociada se omite con frecuencia bajo el yeso.</li></ul>
    <h4>Imágenes</h4><ul>
    <li>Proyecciones posteroanterior, lateral y oblicua de muñeca, con medición explícita de los cuatro parámetros radiológicos.</li>
    <li>Proyección lateral con inclinación de 10 a 15° para valorar la superficie articular con el plano real de la fosa del semilunar.</li>
    <li>TC en fracturas articulares complejas, en sospecha de fragmento volar del semilunar y en planificación preoperatoria de trazos multifragmentarios.</li></ul>`,
    en:`<h4>Focused examination</h4><ul>
    <li><b>Median nerve.</b> Document index pulp sensation before reduction. Acute carpal tunnel syndrome with disproportionate pain and progressive paraesthesia is an indication for urgent release, not observation.</li>
    <li><b>Distal radioulnar joint.</b> Piano-key test and stability through pronosupination. Residual instability explains much of late ulnar-sided pain.</li>
    <li><b>Scaphoid and carpus.</b> Palpate the anatomical snuffbox: an associated scaphoid fracture is often missed under the cast.</li></ul>
    <h4>Imaging</h4><ul>
    <li>Posteroanterior, lateral and oblique wrist views, with explicit measurement of the four radiographic parameters.</li>
    <li>Lateral view tilted 10 to 15° to assess the articular surface in the true plane of the lunate fossa.</li>
    <li>CT in complex articular fractures, when a volar lunate facet fragment is suspected and for preoperative planning of multifragmentary patterns.</li></ul>`},
  mgmt:{
    es:`<h4>Tratamiento ortopédico</h4><p>Reducción cerrada bajo anestesia del foco o bloqueo regional e inmovilización con yeso braquipalmar o antebraquipalmar en posición neutra. Es el tratamiento adecuado en la fractura extraarticular estable, en la fractura sin desplazamiento y en el paciente de baja demanda funcional en quien la anatomía radiológica se correlaciona débilmente con el resultado.</p>
    <p><b>Control radiológico</b> a la primera, segunda y sexta semana. El desplazamiento secundario ocurre casi siempre dentro de las dos primeras semanas y es el momento de decidir la conversión a cirugía, no después.</p>
    <h4>Criterios de reducción inaceptable</h4><ul>
    <li>Inclinación dorsal mayor a 10° o pérdida de la inclinación volar.</li>
    <li>Acortamiento radial superior a 3 mm o varianza cubital positiva sintomática.</li>
    <li>Escalón o separación articular mayor a 2 mm.</li>
    <li>Inestabilidad de la articulación radiocubital distal asociada.</li></ul>
    <h4>Tratamiento quirúrgico</h4><ul>
    <li><b>Placa volar bloqueada</b> por abordaje de Henry modificado. Es la técnica dominante: permite movilización precoz y controla el fragmento volar del semilunar, cuya pérdida es la causa más frecuente de fracaso.</li>
    <li><b>Fijación con agujas de Kirschner</b> con o sin yeso, en fracturas extraarticulares en hueso de buena calidad.</li>
    <li><b>Fijador externo con ligamentotaxis</b>, hoy reservado a fracturas expuestas, conminución severa o como complemento temporal.</li>
    <li><b>Abordaje dorsal o combinado</b> para el fragmento dorsoulnar y para la reducción articular bajo visión directa o artroscópica.</li></ul>`,
    en:`<h4>Non-operative treatment</h4><p>Closed reduction under haematoma block or regional anaesthesia and immobilisation in an above- or below-elbow cast in neutral position. This is appropriate for the stable extra-articular fracture, the undisplaced fracture and the low-demand patient in whom radiographic anatomy correlates weakly with outcome.</p>
    <p><b>Radiographic follow-up</b> at one, two and six weeks. Secondary displacement almost always occurs within the first two weeks, and that is the moment to decide on conversion to surgery, not later.</p>
    <h4>Criteria for unacceptable reduction</h4><ul>
    <li>Dorsal tilt greater than 10° or loss of volar tilt.</li>
    <li>Radial shortening over 3 mm or symptomatic positive ulnar variance.</li>
    <li>Articular step-off or gap greater than 2 mm.</li>
    <li>Associated distal radioulnar joint instability.</li></ul>
    <h4>Operative treatment</h4><ul>
    <li><b>Volar locking plate</b> through a modified Henry approach. The dominant technique: it allows early motion and controls the volar lunate facet fragment, whose loss is the commonest cause of failure.</li>
    <li><b>Kirschner wire fixation</b> with or without a cast, in extra-articular fractures in good quality bone.</li>
    <li><b>External fixation with ligamentotaxis</b>, now reserved for open fractures, severe comminution or as a temporary adjunct.</li>
    <li><b>Dorsal or combined approach</b> for the dorsoulnar fragment and for articular reduction under direct or arthroscopic vision.</li></ul>`},
  rehab:{
    intro:{es:"Protocolo orientativo tras osteosíntesis con placa volar bloqueada. En el tratamiento ortopédico las fases se desplazan y comienzan al retirar el yeso, habitualmente a las seis semanas.",
           en:"Guideline protocol after volar locking plate fixation. With cast treatment the phases shift and begin at cast removal, usually at six weeks."},
    phases:[
      {when:{es:"Días 0 a 14",en:"Days 0 to 14"},
       title:{es:"Edema, dedos y hombro",en:"Oedema, fingers and shoulder"},
       body:{es:"Elevación por sobre el nivel del corazón, movilización activa completa de todos los dedos desde el primer día, incluida la flexión del metacarpofalángico que se pierde rápidamente. Rango libre de codo y hombro para prevenir la rigidez por desuso, que en el adulto mayor puede ser más incapacitante que la fractura misma.",
             en:"Elevation above heart level, full active motion of all fingers from day one, including metacarpophalangeal flexion which is lost quickly. Free elbow and shoulder motion to prevent disuse stiffness, which in the older adult can be more disabling than the fracture itself."},
       crit:{es:"Puño completo y ausencia de edema depresible en el dorso de la mano.",en:"Full fist and no pitting oedema over the dorsum of the hand."}},
      {when:{es:"Semanas 2 a 6",en:"Weeks 2 to 6"},
       title:{es:"Rango de muñeca y pronosupinación",en:"Wrist range and pronosupination"},
       body:{es:"Flexoextensión activa y activa asistida sin resistencia, desviación radial y cubital, y trabajo específico de pronosupinación con el codo pegado al cuerpo para no compensar con el hombro. Desensibilización de la cicatriz y vigilancia activa de signos precoces de síndrome de dolor regional complejo.",
             en:"Active and active-assisted flexion-extension without resistance, radial and ulnar deviation, and specific pronosupination work with the elbow at the side to avoid shoulder compensation. Scar desensitisation and active surveillance for early signs of complex regional pain syndrome."},
       crit:{es:"Arco de flexoextensión superior a 80° y pronosupinación de al menos 120° en total.",en:"Flexion-extension arc over 80° and total pronosupination of at least 120°."}},
      {when:{es:"Semanas 6 a 12",en:"Weeks 6 to 12"},
       title:{es:"Fuerza de prensión y carga",en:"Grip strength and loading"},
       body:{es:"Fortalecimiento progresivo de prensión y pinza con dinamómetro y masilla, apoyo con carga en la mano en cadena cerrada, y reeducación de la estabilidad del carpo. Introducción de gestos laborales reales en lugar de ejercicios abstractos.",
             en:"Progressive grip and pinch strengthening with dynamometer and putty, closed-chain weight-bearing through the hand, and carpal stability retraining. Real work tasks introduced instead of abstract exercises."},
       crit:{es:"Fuerza de prensión sobre el 70% del lado contralateral y ausencia de dolor con carga axial.",en:"Grip strength above 70% of the contralateral side and no pain on axial loading."}},
      {when:{es:"Meses 3 a 6",en:"Months 3 to 6"},
       title:{es:"Retorno a la actividad",en:"Return to activity"},
       body:{es:"Trabajo de resistencia y de impacto controlado según la demanda, retorno deportivo progresivo y revisión del puesto de trabajo. La meseta de recuperación de fuerza se alcanza cerca del sexto mes, lo que conviene anticipar al paciente desde el inicio para evitar la frustración.",
             en:"Endurance and controlled impact work according to demand, progressive return to sport and workstation review. The strength recovery plateau is reached near six months, which should be explained to the patient from the start to avoid frustration."},
       crit:{es:"Fuerza sobre el 90% del lado contralateral y desempeño sin dolor en la tarea específica.",en:"Strength above 90% of the contralateral side and pain-free performance of the specific task."}}
    ],
    media:[{es:"Movilización precoz de dedos y control del edema",en:"Early finger mobilisation and oedema control"},
           {es:"Progresión de pronosupinación sin compensación",en:"Pronosupination progression without compensation"},
           {es:"Fortalecimiento de prensión con dinamómetro",en:"Grip strengthening with dynamometer"}]
  }
},
{
  id:"lca", region:"rodilla", kind:"ortho", code:"LCA", full:true,
  name:{es:"Rotura del ligamento cruzado anterior", en:"Anterior cruciate ligament tear"},
  sub:{es:"Diagnóstico, decisión quirúrgica y retorno al deporte", en:"Diagnosis, surgical decision and return to sport"},
  def:{
    es:`<h4>Definición</h4><p>Rotura del principal restrictor de la traslación anterior de la tibia respecto al fémur y de la rotación interna tibial. Su pérdida genera inestabilidad rotatoria anterolateral, que es el fenómeno que el paciente describe como fallo de la rodilla y que se busca reproducir con la prueba del pivot shift.</p>
    <h4>Mecanismo</h4><ul>
    <li><b>Sin contacto</b> en la gran mayoría de los casos: desaceleración con el pie fijo, valgo dinámico y rotación interna femoral sobre tibia fija.</li>
    <li>Riesgo entre dos y ocho veces mayor en mujeres deportistas, atribuido a diferencias en el control neuromuscular, en la geometría del surco intercondíleo y en la pendiente tibial posterior.</li></ul>
    <h4>Lesiones asociadas</h4><ul>
    <li>Contusión ósea en el cóndilo femoral lateral y en la meseta tibial posterolateral, prácticamente patognomónica en la resonancia aguda.</li>
    <li>Lesión meniscal, lateral en la fase aguda y medial en la inestabilidad crónica.</li>
    <li><b>Lesión en rampa</b> de la unión meniscocapsular medial y lesión de la raíz posterior, ambas subdiagnosticadas y determinantes de la inestabilidad residual.</li>
    <li><b>Fractura de Segond</b>, avulsión capsular lateral que es un signo indirecto de alta especificidad.</li></ul>`,
    en:`<h4>Definition</h4><p>Tear of the primary restraint to anterior tibial translation and internal tibial rotation. Its loss produces anterolateral rotatory instability, the phenomenon patients describe as the knee giving way and the one reproduced by the pivot shift test.</p>
    <h4>Mechanism</h4><ul>
    <li><b>Non-contact</b> in the great majority: deceleration with the foot planted, dynamic valgus and femoral internal rotation over a fixed tibia.</li>
    <li>Two to eight times higher risk in female athletes, attributed to differences in neuromuscular control, intercondylar notch geometry and posterior tibial slope.</li></ul>
    <h4>Associated injuries</h4><ul>
    <li>Bone bruise on the lateral femoral condyle and posterolateral tibial plateau, virtually pathognomonic on acute MRI.</li>
    <li>Meniscal tear, lateral in the acute phase and medial in chronic instability.</li>
    <li><b>Ramp lesion</b> of the medial meniscocapsular junction and posterior root tear, both underdiagnosed and decisive for residual instability.</li>
    <li><b>Segond fracture</b>, a lateral capsular avulsion that is a highly specific indirect sign.</li></ul>`},
  classif:{
    box:{
      title:{es:"Graduación del pivot shift (IKDC)", en:"Pivot shift grading (IKDC)"},
      rows:[
        {k:{es:"Grado 0",en:"Grade 0"}, v:{es:"Ausente, simétrico con el lado sano.", en:"Absent, symmetric with the healthy side."}},
        {k:{es:"Grado I",en:"Grade I"}, v:{es:"Deslizamiento suave, glide.", en:"Smooth glide."}},
        {k:{es:"Grado II",en:"Grade II"}, v:{es:"Resalte franco, clunk.", en:"Clear clunk."}},
        {k:{es:"Grado III",en:"Grade III"}, v:{es:"Subluxación con bloqueo momentáneo.", en:"Subluxation with momentary locking."}}
      ]
    },
    es:`<h4>Graduación de Lachman por traslación y tope</h4><ul>
    <li><b>Grado I</b> traslación de 3 a 5 mm. <b>Grado II</b> de 6 a 10 mm. <b>Grado III</b> mayor a 10 mm.</li>
    <li>La calidad del tope final es más informativa que los milímetros: un tope blando indica rotura completa aun con traslación moderada.</li></ul>
    <h4>Lo que conviene consignar siempre</h4><p>La descripción útil para la decisión no es solo la rotura del ligamento, sino el conjunto: estado meniscal, integridad de la raíz posterior medial, presencia de lesión en rampa, pendiente tibial posterior y alineación coronal. Estos elementos explican la mayor parte de las revisiones.</p>`,
    en:`<h4>Lachman grading by translation and endpoint</h4><ul>
    <li><b>Grade I</b> 3 to 5 mm translation. <b>Grade II</b> 6 to 10 mm. <b>Grade III</b> over 10 mm.</li>
    <li>The quality of the endpoint is more informative than the millimetres: a soft endpoint indicates a complete tear even with moderate translation.</li></ul>
    <h4>What should always be recorded</h4><p>The description that guides decision-making is not the ligament tear alone but the whole picture: meniscal status, medial posterior root integrity, presence of a ramp lesion, posterior tibial slope and coronal alignment. These elements explain most revisions.</p>`},
  evalx:{
    es:`<h4>Pruebas clínicas</h4><ul>
    <li><b>Lachman</b>, la más sensible en la fase aguda porque no requiere vencer el espasmo muscular. Se realiza a 20 a 30° de flexión.</li>
    <li><b>Pivot shift</b>, la más específica y la que mejor se correlaciona con la inestabilidad funcional referida por el paciente. Su sensibilidad en vigilia es baja por defensa muscular.</li>
    <li><b>Cajón anterior</b> a 90°, de menor rendimiento aislado pero útil para la inestabilidad crónica.</li>
    <li>Descartar sistemáticamente lesiones asociadas: cajón posterior, estrés en varo y valgo a 0° y 30°, dial test a 30° y 90°.</li></ul>
    <h4>Imágenes</h4><ul>
    <li>Radiografía en dos planos más proyección de túnel, buscando la fractura de Segond y la avulsión de la espina tibial en el paciente esqueléticamente inmaduro.</li>
    <li>Telemetría de extremidades inferiores y radiografía lateral estricta para medir la pendiente tibial posterior, especialmente en revisiones.</li>
    <li>Resonancia magnética para confirmar el diagnóstico y, sobre todo, para caracterizar meniscos, rampa y raíces.</li></ul>`,
    en:`<h4>Clinical tests</h4><ul>
    <li><b>Lachman</b>, the most sensitive in the acute phase because it does not need to overcome muscle spasm. Performed at 20 to 30° of flexion.</li>
    <li><b>Pivot shift</b>, the most specific and the one that best correlates with the functional instability patients report. Its sensitivity while awake is low because of guarding.</li>
    <li><b>Anterior drawer</b> at 90°, of lower yield in isolation but useful in chronic instability.</li>
    <li>Systematically rule out associated injuries: posterior drawer, varus and valgus stress at 0° and 30°, dial test at 30° and 90°.</li></ul>
    <h4>Imaging</h4><ul>
    <li>Two-plane radiographs plus a notch view, looking for a Segond fracture and tibial spine avulsion in the skeletally immature patient.</li>
    <li>Full-length lower limb films and a strict lateral view to measure posterior tibial slope, particularly in revision settings.</li>
    <li>MRI to confirm the diagnosis and, above all, to characterise menisci, ramp and roots.</li></ul>`},
  mgmt:{
    es:`<h4>La decisión no es automática</h4><p>No toda rotura del ligamento cruzado anterior se opera. La decisión combina la demanda funcional, la inestabilidad objetivada, la edad fisiológica y la presencia de lesiones reparables. Un paciente sedentario, sin episodios de fallo y con buen control neuromuscular puede evolucionar bien con rehabilitación estructurada.</p>
    <h4>Indicaciones claras de reconstrucción</h4><ul>
    <li>Inestabilidad sintomática recurrente pese a rehabilitación adecuada.</li>
    <li>Lesión meniscal reparable asociada, para proteger la reparación.</li>
    <li>Deportes de pivote y contacto, actividad laboral de alta demanda.</li>
    <li>Paciente esqueléticamente inmaduro con avulsión desplazada de la espina tibial.</li></ul>
    <h4>Injertos</h4><ul>
    <li><b>Isquiotibiales.</b> Menor morbilidad anterior, pero mayor tasa de rerotura en el deportista joven de pivote.</li>
    <li><b>Hueso-tendón rotuliano-hueso.</b> Integración ósea directa, con dolor anterior y déficit de extensión como precio.</li>
    <li><b>Tendón cuadricipital.</b> Buen volumen y morbilidad intermedia, con uso creciente en revisión.</li>
    <li><b>Aloinjerto</b>, reservado a revisión y a pacientes de baja demanda por su mayor tasa de fracaso en jóvenes.</li></ul>
    <h4>Complementos y momento quirúrgico</h4><p>La tenodesis anterolateral o la reconstrucción del ligamento anterolateral reduce la rerotura en pacientes jóvenes de pivote, con hiperlaxitud o en revisión. Respecto del momento, importa menos la fecha que el estado de la rodilla: operar con rodilla fría, extensión completa y buen control del cuádriceps reduce el riesgo de artrofibrosis.</p>`,
    en:`<h4>The decision is not automatic</h4><p>Not every anterior cruciate ligament tear is operated. The decision combines functional demand, objective instability, physiological age and the presence of repairable lesions. A sedentary patient with no giving-way episodes and good neuromuscular control may do well with structured rehabilitation.</p>
    <h4>Clear indications for reconstruction</h4><ul>
    <li>Recurrent symptomatic instability despite adequate rehabilitation.</li>
    <li>Associated repairable meniscal tear, to protect the repair.</li>
    <li>Pivoting and contact sports, high-demand occupations.</li>
    <li>Skeletally immature patient with a displaced tibial spine avulsion.</li></ul>
    <h4>Grafts</h4><ul>
    <li><b>Hamstrings.</b> Lower anterior morbidity but a higher re-tear rate in the young pivoting athlete.</li>
    <li><b>Bone-patellar tendon-bone.</b> Direct bone healing, at the price of anterior knee pain and extension deficit.</li>
    <li><b>Quadriceps tendon.</b> Good volume and intermediate morbidity, increasingly used in revision.</li>
    <li><b>Allograft</b>, reserved for revision and low-demand patients given its higher failure rate in the young.</li></ul>
    <h4>Adjuncts and timing</h4><p>Anterolateral tenodesis or anterolateral ligament reconstruction reduces re-tear in young pivoting patients, in hyperlaxity and in revision. As for timing, the date matters less than the state of the knee: operating on a quiet knee with full extension and good quadriceps control reduces the risk of arthrofibrosis.</p>`},
  rehab:{
    intro:{es:"Protocolo por criterios, no por calendario. Cada fase se supera al cumplir objetivos medibles. Esta es la sección donde el trabajo del kinesiólogo determina el resultado más que la técnica quirúrgica.",
           en:"Criterion-based rather than calendar-based protocol. Each phase is passed by meeting measurable goals. This is the section where the physiotherapist's work determines the outcome more than the surgical technique."},
    phases:[
      {when:{es:"Prequirúrgico",en:"Pre-operative"},
       title:{es:"Prehabilitación",en:"Prehabilitation"},
       body:{es:"Recuperar extensión completa simétrica, resolver el derrame y restablecer la contracción voluntaria del cuádriceps antes de la cirugía. La evidencia es consistente: el estado prequirúrgico predice el resultado a dos años mejor que la mayoría de las variables intraoperatorias.",
             en:"Restore full symmetric extension, resolve the effusion and re-establish voluntary quadriceps contraction before surgery. The evidence is consistent: the pre-operative state predicts two-year outcome better than most intra-operative variables."},
       crit:{es:"Extensión completa, derrame ausente o mínimo y elevación activa sin retraso de extensión.",en:"Full extension, absent or minimal effusion and active straight-leg raise without extension lag."}},
      {when:{es:"Semanas 0 a 2",en:"Weeks 0 to 2"},
       title:{es:"Control del derrame y extensión",en:"Effusion control and extension"},
       body:{es:"Extensión pasiva completa como prioridad absoluta, por sobre la ganancia de flexión. Activación del cuádriceps con electroestimulación si hay inhibición artrogénica. Carga según tolerancia salvo reparación meniscal o de raíz asociada, que modifica la indicación.",
             en:"Full passive extension as the absolute priority, ahead of flexion gains. Quadriceps activation with electrical stimulation if arthrogenic inhibition is present. Weight-bearing as tolerated unless a meniscal or root repair modifies the instruction."},
       crit:{es:"Extensión simétrica al lado sano, flexión de 90° y control del derrame.",en:"Extension symmetric to the healthy side, 90° flexion and controlled effusion."}},
      {when:{es:"Semanas 2 a 12",en:"Weeks 2 to 12"},
       title:{es:"Fuerza y control neuromuscular",en:"Strength and neuromuscular control"},
       body:{es:"Fortalecimiento progresivo en cadena cerrada, incorporación de cadena abierta controlada de 90 a 45° desde la cuarta semana, trabajo de isquiotibiales y de cadera con foco en glúteo medio, y reeducación del valgo dinámico frente a espejo o con video.",
             en:"Progressive closed-chain strengthening, controlled open-chain work from 90 to 45° from week four, hamstring and hip work focused on gluteus medius, and dynamic valgus retraining with mirror or video feedback."},
       crit:{es:"Sentadilla unipodal controlada sin valgo y déficit de fuerza de cuádriceps menor al 20%.",en:"Controlled single-leg squat without valgus and quadriceps strength deficit under 20%."}},
      {when:{es:"Meses 3 a 6",en:"Months 3 to 6"},
       title:{es:"Carrera, pliometría y agilidad",en:"Running, plyometrics and agility"},
       body:{es:"Progresión de carrera lineal, luego pliometría de doble a monopodal y finalmente cambios de dirección planificados. Introducción de la tarea dual, porque la mayoría de las rerroturas ocurren en situaciones de decisión y no en gestos ensayados.",
             en:"Linear running progression, then double- to single-leg plyometrics and finally planned change of direction. Dual-task work is introduced, because most re-tears occur in decision-making situations rather than rehearsed movements."},
       crit:{es:"Índice de simetría superior al 85% en batería de saltos y ausencia de derrame tras la carga.",en:"Limb symmetry index above 85% in the hop battery and no effusion after loading."}},
      {when:{es:"Meses 9 a 12",en:"Months 9 to 12"},
       title:{es:"Retorno al deporte",en:"Return to sport"},
       body:{es:"Retorno progresivo al entrenamiento con el equipo y luego a la competencia. El retorno antes de los nueve meses se asocia a un aumento sustancial del riesgo de nueva lesión, y cada mes adicional hasta el noveno reduce ese riesgo de forma significativa.",
             en:"Progressive return to team training and then to competition. Return before nine months is associated with a substantial increase in re-injury risk, and each additional month up to the ninth reduces that risk significantly."},
       crit:{es:"Índice de simetría superior al 90% en fuerza y saltos, alta psicológica evaluada con escala específica y gesto deportivo sin aprensión.",en:"Limb symmetry index above 90% in strength and hop tests, psychological readiness assessed with a specific scale, and sport-specific movement without apprehension."}}
    ],
    media:[{es:"Extensión terminal y control del derrame",en:"Terminal extension and effusion control"},
           {es:"Corrección del valgo dinámico en sentadilla unipodal",en:"Dynamic valgus correction in single-leg squat"},
           {es:"Batería de saltos para el alta deportiva",en:"Hop test battery for sport clearance"}]
  }
},
{
  id:"luxacion-gh", region:"hombro", kind:"trauma", code:"GH", full:true,
  name:{es:"Luxación glenohumeral anterior", en:"Anterior glenohumeral dislocation"},
  sub:{es:"Primer episodio e inestabilidad recidivante", en:"First episode and recurrent instability"},
  def:{
    es:`<h4>Definición</h4><p>Pérdida completa de la relación entre la cabeza humeral y la cavidad glenoidea, con desplazamiento anterior de la cabeza. Es la luxación más frecuente del organismo y representa cerca del 95% de las luxaciones del hombro.</p>
    <h4>Por qué el hombro se luxa</h4><ul>
    <li>La glenoides cubre alrededor de un tercio de la superficie de la cabeza humeral. La articulación privilegia el rango de movimiento sobre la estabilidad.</li>
    <li>Los estabilizadores estáticos son el rodete, la cápsula, los ligamentos glenohumerales y la presión intraarticular negativa; los dinámicos son el manguito rotador y el ritmo escapulotorácico.</li>
    <li>En abducción y rotación externa el ligamento glenohumeral inferior queda como freno principal, y su falla es la puerta de entrada de la luxación.</li></ul>
    <h4>Epidemiología y recidiva</h4><ul>
    <li>Distribución bimodal, con un primer pico en el varón joven por traumatismo deportivo y un segundo pico en el adulto mayor, en quien la luxación se asocia con frecuencia a rotura del manguito rotador y no a lesión del rodete.</li>
    <li><b>La edad es el predictor más potente de recidiva.</b> Bajo los 20 años la tasa supera el 70%, mientras que sobre los 40 años cae por debajo del 15%.</li>
    <li>Otros predictores: deporte de contacto o con el brazo sobre la cabeza, hiperlaxitud, defecto óseo glenoideo y defecto humeral enganchante.</li></ul>`,
    en:`<h4>Definition</h4><p>Complete loss of the relationship between the humeral head and the glenoid cavity, with anterior displacement of the head. It is the most frequent dislocation in the body and accounts for about 95% of shoulder dislocations.</p>
    <h4>Why the shoulder dislocates</h4><ul>
    <li>The glenoid covers around a third of the humeral head surface. The joint favours range of motion over stability.</li>
    <li>Static stabilisers are the labrum, capsule, glenohumeral ligaments and negative intra-articular pressure; dynamic ones are the rotator cuff and scapulothoracic rhythm.</li>
    <li>In abduction and external rotation the inferior glenohumeral ligament becomes the main restraint, and its failure is the gateway to dislocation.</li></ul>
    <h4>Epidemiology and recurrence</h4><ul>
    <li>Bimodal distribution, with a first peak in the young male after sports trauma and a second in the older adult, in whom dislocation is frequently associated with a rotator cuff tear rather than a labral lesion.</li>
    <li><b>Age is the strongest predictor of recurrence.</b> Under 20 the rate exceeds 70%, while over 40 it falls below 15%.</li>
    <li>Other predictors: contact or overhead sport, hyperlaxity, glenoid bone loss and an engaging humeral defect.</li></ul>`},
  classif:{
    box:{
      title:{es:"Lesiones asociadas a la luxación anterior", en:"Lesions associated with anterior dislocation"},
      rows:[
        {k:"Bankart", v:{es:"Avulsión del rodete anteroinferior del reborde glenoideo. Presente en más del 80% de las primeras luxaciones traumáticas.", en:"Avulsion of the anteroinferior labrum from the glenoid rim. Present in over 80% of first traumatic dislocations."}},
        {k:{es:"Bankart óseo",en:"Bony Bankart"}, v:{es:"Fractura por avulsión del reborde glenoideo anteroinferior. Su magnitud determina la indicación de reconstrucción ósea.", en:"Avulsion fracture of the anteroinferior glenoid rim. Its magnitude determines the indication for bony reconstruction."}},
        {k:"Hill-Sachs", v:{es:"Fractura por impactación de la cara posterolateral de la cabeza humeral contra el reborde glenoideo anterior. Se describe hasta en el 90% de las luxaciones anteriores.", en:"Impaction fracture of the posterolateral humeral head against the anterior glenoid rim. Reported in up to 90% of anterior dislocations."}},
        {k:"ALPSA", v:{es:"Rodete avulsionado que cicatriza medializado sobre el cuello escapular. Propio de la inestabilidad crónica y de peor pronóstico tras reparación artroscópica.", en:"Avulsed labrum healing medialised on the scapular neck. Typical of chronic instability and with a worse prognosis after arthroscopic repair."}},
        {k:"HAGL", v:{es:"Avulsión humeral del ligamento glenohumeral inferior. Poco frecuente, fácil de omitir y causa conocida de fracaso de la reparación del rodete.", en:"Humeral avulsion of the inferior glenohumeral ligament. Uncommon, easily missed and a known cause of labral repair failure."}}
      ]
    },
    es:`<h4>El concepto de glenoides en pera invertida</h4><p>Una pérdida ósea glenoidea superior al 20 a 25% transforma el contorno de la glenoides de ovalado a piriforme invertido y compromete de manera crítica el arco de contención. Por encima de ese umbral la reparación del rodete aislada fracasa de forma predecible.</p>
    <h4>Concepto de glenoid track</h4><p>Es la zona de la cabeza humeral que permanece en contacto con la glenoides durante la abducción y rotación externa máximas. Corresponde aproximadamente al 83% del ancho glenoideo, corregido por la pérdida ósea existente.</p><ul>
    <li><b>On-track.</b> El defecto de Hill-Sachs queda dentro de la zona de contacto y no engancha. La reparación del rodete suele ser suficiente.</li>
    <li><b>Off-track.</b> El defecto sobrepasa el borde medial de la zona de contacto y engancha con el reborde glenoideo. Requiere añadir un procedimiento que aborde el defecto humeral o transferir tope óseo.</li></ul>
    <p>Este concepto reemplazó la valoración aislada del tamaño del Hill-Sachs, porque lo determinante no es cuán grande es el defecto sino su relación con la glenoides remanente.</p>
    <h4>Escala ISIS de riesgo de recidiva</h4><p>Puntaje de 0 a 10 que integra edad menor de 20 años, deporte de competición, deporte de contacto o con brazo sobre la cabeza, hiperlaxitud, Hill-Sachs visible en rotación externa y pérdida del contorno glenoideo. Un puntaje mayor a 6 se asocia a alta tasa de fracaso de la reparación artroscópica aislada.</p>`,
    en:`<h4>The inverted pear concept</h4><p>Glenoid bone loss over 20 to 25% turns the glenoid contour from oval to an inverted pear and critically compromises the containing arc. Above that threshold, isolated labral repair fails predictably.</p>
    <h4>The glenoid track concept</h4><p>This is the zone of the humeral head that stays in contact with the glenoid through maximal abduction and external rotation. It corresponds to roughly 83% of glenoid width, corrected for existing bone loss.</p><ul>
    <li><b>On-track.</b> The Hill-Sachs defect remains within the contact zone and does not engage. Labral repair alone is usually sufficient.</li>
    <li><b>Off-track.</b> The defect passes the medial edge of the contact zone and engages the glenoid rim. It requires an added procedure addressing the humeral defect or a bone block transfer.</li></ul>
    <p>This concept replaced isolated assessment of Hill-Sachs size, because what matters is not how large the defect is but its relationship to the remaining glenoid.</p>
    <h4>ISIS recurrence risk score</h4><p>A 0 to 10 score combining age under 20, competitive sport, contact or overhead sport, hyperlaxity, a Hill-Sachs visible on external rotation views and loss of the glenoid contour. A score above 6 is associated with a high failure rate of isolated arthroscopic repair.</p>`},
  evalx:{
    es:`<h4>Examen en el episodio agudo</h4><ul>
    <li>Actitud en ligera abducción y rotación externa, con el paciente sosteniendo el brazo y resistiendo toda rotación interna.</li>
    <li>Pérdida del contorno deltoideo con signo de la charretera y prominencia del acromion.</li>
    <li><b>Nervio axilar.</b> Explorar y consignar la sensibilidad en la región deltoidea lateral antes y después de la reducción. Es la lesión neurológica más frecuente y en la mayoría de los casos es una neuroapraxia transitoria.</li>
    <li>Estado vascular distal, especialmente en el adulto mayor y en luxaciones de alta energía.</li></ul>
    <h4>Examen tras la reducción y en la inestabilidad crónica</h4><ul>
    <li><b>Aprensión y recolocación.</b> Solo la sensación de inminente luxación tiene valor; el dolor aislado no la reemplaza.</li>
    <li><b>Prueba de sulcus</b> para inestabilidad inferior y <b>escala de Beighton</b> para hiperlaxitud generalizada, que modifica la conducta quirúrgica.</li>
    <li>Evaluación del manguito rotador en todo paciente sobre 40 años: la debilidad persistente en rotación externa a las tres semanas obliga a estudiar el manguito.</li></ul>
    <h4>Imágenes</h4><ul>
    <li>Radiografía anteroposterior verdadera y proyección axilar o de Velpeau antes y después de la reducción. La proyección axilar es la que evita el diagnóstico erróneo de la luxación posterior.</li>
    <li>TC con reconstrucción tridimensional y sustracción de la cabeza humeral para cuantificar la pérdida ósea glenoidea y medir el defecto humeral. Es el estudio que define la conducta en el paciente con recidiva.</li>
    <li>Resonancia magnética, idealmente artrorresonancia, para el rodete, los ligamentos y el manguito rotador.</li></ul>`,
    en:`<h4>Examination in the acute episode</h4><ul>
    <li>The arm is held in slight abduction and external rotation, supported by the patient, who resists any internal rotation.</li>
    <li>Loss of the deltoid contour with a squared-off shoulder and a prominent acromion.</li>
    <li><b>Axillary nerve.</b> Test and record sensation over the lateral deltoid before and after reduction. It is the commonest neurological injury and in most cases a transient neurapraxia.</li>
    <li>Distal vascular status, particularly in the older adult and in high-energy dislocations.</li></ul>
    <h4>Examination after reduction and in chronic instability</h4><ul>
    <li><b>Apprehension and relocation.</b> Only the sense of impending dislocation counts; isolated pain does not substitute for it.</li>
    <li><b>Sulcus sign</b> for inferior instability and the <b>Beighton score</b> for generalised hyperlaxity, which modifies surgical strategy.</li>
    <li>Rotator cuff assessment in every patient over 40: persistent external rotation weakness at three weeks mandates cuff imaging.</li></ul>
    <h4>Imaging</h4><ul>
    <li>True anteroposterior and axillary or Velpeau views before and after reduction. The axillary view is what prevents missing a posterior dislocation.</li>
    <li>CT with three-dimensional reconstruction and humeral head subtraction to quantify glenoid bone loss and measure the humeral defect. This is the study that defines management in the patient with recurrence.</li>
    <li>MRI, ideally MR arthrography, for labrum, ligaments and rotator cuff.</li></ul>`},
  mgmt:{
    es:`<h4>Reducción del episodio agudo</h4><p>Se prefieren las técnicas de tracción suave y sostenida con relajación muscular, como las maniobras escapulares o de Cunningham, sobre las maniobras de palanca. La sedación adecuada evita las fracturas iatrogénicas del cuello humeral. Siempre se controla con radiografía posterior a la reducción.</p>
    <p><b>Inmovilización.</b> Tres semanas resultan suficientes en el paciente joven y una a dos semanas bastan sobre los 40 años, donde la rigidez es el problema dominante. La inmovilización en rotación externa se propuso para mejorar la cicatrización del rodete, pero la evidencia posterior no ha confirmado un beneficio consistente sobre la recidiva.</p>
    <h4>Cuándo operar el primer episodio</h4><ul>
    <li>Deportista joven de contacto o con brazo sobre la cabeza, donde la reparación precoz reduce la recidiva de forma sustancial.</li>
    <li>Bankart óseo desplazado o pérdida ósea glenoidea significativa desde el primer episodio.</li>
    <li>Luxación irreducible, interposición de partes blandas o luxación asociada a fractura del troquíter desplazada.</li></ul>
    <h4>Opciones quirúrgicas</h4><ul>
    <li><b>Reparación artroscópica de Bankart.</b> Indicada con pérdida ósea glenoidea menor al 15%, defecto humeral on-track y sin hiperlaxitud marcada. Reinserción del rodete con anclajes, restituyendo el efecto de tope y la tensión capsular.</li>
    <li><b>Remplissage.</b> Tenodesis del infraespinoso dentro del defecto de Hill-Sachs, que lo convierte en extraarticular e impide el enganche. Se asocia a la reparación del rodete en el defecto off-track con pérdida glenoidea aceptable.</li>
    <li><b>Latarjet.</b> Transferencia de la coracoides al reborde anteroinferior de la glenoides. Actúa por tres mecanismos: aumento de la superficie glenoidea, efecto de cabestrillo del tendón conjunto sobre el subescapular y reparación capsular. Es la indicación cuando la pérdida ósea supera el 20 a 25%, en el defecto off-track de gran tamaño, en la revisión y en el deportista de contacto de alto riesgo.</li>
    <li><b>Injerto óseo libre</b>, autólogo de cresta ilíaca o de aloinjerto, en la pérdida ósea masiva o cuando la coracoides no está disponible.</li></ul>
    <p>La decisión no se toma por el número de episodios sino por el estado óseo. Un paciente con dos luxaciones y una pérdida glenoidea del 25% requiere un procedimiento óseo, mientras que uno con cinco episodios y glenoides indemne puede resolverse por vía artroscópica.</p>`,
    en:`<h4>Reduction of the acute episode</h4><p>Gentle sustained traction techniques with muscle relaxation, such as scapular manipulation or the Cunningham manoeuvre, are preferred over leverage techniques. Adequate sedation prevents iatrogenic humeral neck fractures. A post-reduction radiograph is always obtained.</p>
    <p><b>Immobilisation.</b> Three weeks suffice in the young patient and one to two weeks are enough over 40, where stiffness is the dominant problem. Immobilisation in external rotation was proposed to improve labral healing, but subsequent evidence has not confirmed a consistent benefit on recurrence.</p>
    <h4>When to operate a first episode</h4><ul>
    <li>Young contact or overhead athlete, where early repair substantially reduces recurrence.</li>
    <li>Displaced bony Bankart or significant glenoid bone loss from the first episode.</li>
    <li>Irreducible dislocation, soft tissue interposition or dislocation with a displaced greater tuberosity fracture.</li></ul>
    <h4>Surgical options</h4><ul>
    <li><b>Arthroscopic Bankart repair.</b> Indicated with glenoid bone loss under 15%, an on-track humeral defect and no marked hyperlaxity. The labrum is reattached with anchors, restoring the bumper effect and capsular tension.</li>
    <li><b>Remplissage.</b> Infraspinatus tenodesis into the Hill-Sachs defect, making it extra-articular and preventing engagement. Combined with labral repair for an off-track defect with acceptable glenoid loss.</li>
    <li><b>Latarjet.</b> Coracoid transfer to the anteroinferior glenoid rim. It works through three mechanisms: increased glenoid surface, a sling effect of the conjoint tendon on subscapularis, and capsular repair. It is indicated when bone loss exceeds 20 to 25%, in the large off-track defect, in revision and in the high-risk contact athlete.</li>
    <li><b>Free bone graft</b>, iliac crest autograft or allograft, in massive bone loss or when the coracoid is unavailable.</li></ul>
    <p>The decision rests on bone status rather than on the number of episodes. A patient with two dislocations and 25% glenoid loss needs a bony procedure, while one with five episodes and an intact glenoid may be managed arthroscopically.</p>`},
  rehab:{
    intro:{es:"Protocolo orientativo tras reparación artroscópica del rodete. Tras un Latarjet los tiempos son algo más rápidos en rango pero más conservadores en carga, porque lo que debe consolidar es un injerto óseo. El punto crítico compartido es no forzar la rotación externa mientras cicatriza el subescapular o el rodete anterior.",
           en:"Guideline protocol after arthroscopic labral repair. After a Latarjet, range progresses somewhat faster but loading is more conservative, because what must heal is a bone graft. The shared critical point is not to force external rotation while the subscapularis or the anterior labrum is healing."},
    phases:[
      {when:{es:"Semanas 0 a 3",en:"Weeks 0 to 3"},
       title:{es:"Protección de la reparación",en:"Protecting the repair"},
       body:{es:"Cabestrillo permanente salvo higiene y ejercicios. Movilización activa de codo, muñeca y mano, y movilización pasiva escapulotorácica. Rotación externa limitada a la posición neutra: el gesto que rompe la reparación es exactamente el que produjo la luxación.",
             en:"Sling at all times except for hygiene and exercises. Active elbow, wrist and hand motion, and passive scapulothoracic mobilisation. External rotation limited to neutral: the movement that disrupts the repair is exactly the one that caused the dislocation."},
       crit:{es:"Dolor controlado en reposo y ausencia de déficit sensitivo en la región deltoidea lateral.",en:"Controlled resting pain and no sensory deficit over the lateral deltoid."}},
      {when:{es:"Semanas 3 a 6",en:"Weeks 3 to 6"},
       title:{es:"Rango pasivo y control escapular",en:"Passive range and scapular control"},
       body:{es:"Progresión de elevación pasiva y asistida hasta 140°, con rotación externa hasta 30° en el plano escapular. Reeducación del ritmo escapulotorácico, isométricos submáximos del manguito y trabajo del serrato anterior y del trapecio inferior.",
             en:"Progression of passive and assisted elevation to 140°, with external rotation to 30° in the scapular plane. Scapulothoracic rhythm retraining, submaximal cuff isometrics and work on serratus anterior and lower trapezius."},
       crit:{es:"Elevación pasiva de 140° sin dolor y control escapular mantenido en el descenso del brazo.",en:"Painless passive elevation to 140° and maintained scapular control on lowering the arm."}},
      {when:{es:"Semanas 6 a 12",en:"Weeks 6 to 12"},
       title:{es:"Rango completo y fuerza del manguito",en:"Full range and cuff strength"},
       body:{es:"Recuperación progresiva de la rotación externa completa y fortalecimiento con banda elástica en rotadores, deltoides y estabilizadores escapulares. Introducción de trabajo en cadena cerrada y de propiocepción con el brazo bajo el nivel del hombro.",
             en:"Progressive recovery of full external rotation and elastic band strengthening of rotators, deltoid and scapular stabilisers. Closed-chain work and proprioception with the arm below shoulder level are introduced."},
       crit:{es:"Rango simétrico al lado sano y fuerza de rotadores sobre el 80% del contralateral.",en:"Range symmetric to the healthy side and rotator strength above 80% of the contralateral side."}},
      {when:{es:"Meses 3 a 6",en:"Months 3 to 6"},
       title:{es:"Trabajo sobre la cabeza y potencia",en:"Overhead work and power"},
       body:{es:"Fortalecimiento en el rango de abducción y rotación externa, pliometría de miembro superior y progresión del gesto deportivo. En el lanzador se reintroduce el programa de lanzamiento por etapas, con control de la carga semanal.",
             en:"Strengthening in abduction and external rotation, upper limb plyometrics and progression of the sporting movement. In the thrower, an interval throwing programme is reintroduced with weekly load monitoring."},
       crit:{es:"Ausencia de aprensión en abducción y rotación externa máximas y simetría de fuerza sobre el 90%.",en:"No apprehension in maximal abduction and external rotation, and strength symmetry above 90%."}},
      {when:{es:"Meses 6 a 9",en:"Months 6 to 9"},
       title:{es:"Retorno al deporte de contacto",en:"Return to contact sport"},
       body:{es:"El retorno a deportes de contacto se difiere hasta los seis meses como mínimo, y hasta los nueve en el deportista con factores de riesgo acumulados. La decisión combina rango, fuerza, ausencia de aprensión y confianza referida por el paciente.",
             en:"Return to contact sport is deferred to a minimum of six months, and up to nine in athletes with accumulated risk factors. The decision combines range, strength, absence of apprehension and the patient's reported confidence."},
       crit:{es:"Alta funcional completa y ausencia de episodios de subluxación durante el entrenamiento controlado.",en:"Full functional clearance and no subluxation episodes during controlled training."}}
    ],
    media:[{es:"Rangos permitidos y prohibidos en las primeras seis semanas",en:"Permitted and prohibited ranges in the first six weeks"},
           {es:"Reeducación del ritmo escapulotorácico",en:"Scapulothoracic rhythm retraining"},
           {es:"Progresión de fortalecimiento del manguito rotador",en:"Rotator cuff strengthening progression"}]
  }
},

function stageLabel(x,y,txt,anchor){
  return `<text x="${x}" y="${y}" fill="${MC.grey}" font-family="ui-monospace,monospace" font-size="9.5" letter-spacing="1.4" text-anchor="${anchor||"start"}">${txt}</text>`;
}
function tagLabel(x,y,txt,col){
  return `<text x="${x}" y="${y}" fill="${col||MC.edge}" font-family="ui-monospace,monospace" font-size="10" letter-spacing=".8">${txt}</text>`;
}

/* voxel mesh clipped to a fragment — reads as a segmented CT reconstruction */
function mesh(clipId, y0, y1){
  let s = `<g clip-path="url(#${clipId})">`;
  for(let y=y0; y<=y1; y+=10)
    s += `<path d="M36,${y} H266" stroke="${CYAN}" stroke-width=".65" opacity=".26"/>`;
  for(let x=62; x<=216; x+=13)
    s += `<path d="M${x},${y0} V${y1}" stroke="${CYAN}" stroke-width=".65" opacity=".14"/>`;
  for(let y=y0+4; y<=y1; y+=30)
    for(let x=62; x<=216; x+=26)
      s += `<circle cx="${x}" cy="${y}" r="1.15" fill="${CYAN}" opacity=".5"/>`;
  return s + `</g>`;
}

function mechPanel(pid){
  const m = MECH[pid];
  if(!m) return `<div class="prose"><p class="muted">${t("mechPending")}</p></div>`;
  const sc = m.stages[S.mechStage] || m.stages[0];
  const dots = m.stages.map((x,i)=>`<button class="mscene${i===S.mechStage?" on":""}" data-mstage="${i}">
      <span class="mn">${i+1}</span><span class="ml">${L(x.t)}</span></button>`).join("");
  return `<div class="prose" style="max-width:none">
    <p style="max-width:78ch">${L(m.intro)}</p>
    <div class="mech">
      <div class="mstage">
        <div class="stage-tag"><span class="eyebrow">${t("mechScene")} ${S.mechStage+1} / ${m.stages.length}</span></div>
        <div class="mcanvas" id="mechCanvas">${MECH_SVG[pid]()}</div>
        <div class="stage-note" id="mechNote"><b id="mechTitle">${L(sc.t)}</b><span>${L(sc.d)}</span></div>
      </div>
      <div>
        <div class="mscenes">${dots}</div>
        <div class="ao-controls">
          <button class="btn ghost" data-mech="prev">${t("prev")}</button>
          <button class="btn" data-mech="next">${t("next")}</button>
          <button class="btn ghost" data-mech="play">${S.mechPlay?t("stop"):t("play")}</button>
        </div>
        <p class="small" style="margin-top:14px">${t("mechNote")}</p>
      </div>
    </div>
  </div>`;
}

function viewPathology(){
  const p = PATHOLOGIES.find(x=>x.id===S.open);
  const cb = p.classif.box;
  const boxRows = cb.rows.map(r=>`<div class="classrow"><div class="k code">${L(r.k)}</div><div class="v">${L(r.v)}</div></div>`).join("");
  const phases = p.rehab.phases.map(f=>`<div class="phase"><div class="phase-when">${L(f.when)}</div>
    <div><h4>${L(f.title)}</h4><p>${L(f.body)}</p>
    <div class="crit"><b>${LANG==="es"?"Criterio de progresión":"Progression criterion"}</b>${L(f.crit)}</div></div></div>`).join("");
  const panes = [
    `<div class="prose">${L(p.def)}</div>`,
    mechPanel(p.id),
    `<div class="prose"><div class="classbox"><span class="eyebrow">${L(cb.title)}</span><div style="margin-top:8px">${boxRows}</div></div>${L(p.classif)}</div>`,
    `<div class="prose">${L(p.evalx)}</div>`,
    `<div class="prose">${L(p.mgmt)}</div>`,
    `<div class="prose"><div class="banner" style="background:#EEF4E9;border-color:#C9DBBB;border-left-color:#5C8241;color:#3C5A2A"><div>${t("rehabNote")}</div></div>
      <p style="margin-top:16px">${L(p.rehab.intro)}</p>${phases}
      <h4 style="margin-top:26px">${LANG==="es"?"Material audiovisual de la sección":"Video material for this section"}</h4>
      <div class="grid g3" style="margin-top:12px">${p.rehab.media.map(m=>media(L(m))).join("")}</div></div>`
  ];
  return `<div class="crumb"><button data-back="1">${t("back")}</button><span>›</span><span>${regionName(p.region)}</span></div>
  <div class="detail-head"><div class="row" style="gap:7px"><span class="tag aocode">${p.code}</span><span class="tag">${regionName(p.region)}</span></div>
    <h2 style="margin:10px 0 6px">${L(p.name)}</h2><p class="lead" style="margin:0">${L(p.sub)}</p></div>
  <div class="tabs">${t("tabs").map((x,i)=>`<button class="tab${S.tab===i?" on":""}" data-tab="${i}">${x}</button>`).join("")}</div>
  ${panes.map((h,i)=>`<div class="tabpane${S.tab===i?" on":""}">${h}</div>`).join("")}`;
}

const LAY_STATE = ["hidden","transp","opaque"];
function viewSim(){
  const done = S.surgStep >= SURG_STEPS.length;
  const st = SURG_STEPS[Math.min(S.surgStep, SURG_STEPS.length-1)];
  const cases = SURG_CASES.map(c=>`<button class="scase${c.id===S.surgCase?" on":""}${c.ready?"":" off"}" data-scase="${c.id}"${c.ready?"":" disabled"}>
      <span class="tag aocode">${c.code}</span><b>${L(c.n)}</b><span>${L(c.s)}</span>
      ${c.ready?"":`<em>${t("casePending")}</em>`}</button>`).join("");

  const instr = INSTRUMENTS.map(i=>`<button class="instr${S.instr===i.id?" on":""}" data-instr="${i.id}" title="${L(i.n)}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${i.ic}</svg>
      <span>${L(i.n)}</span></button>`).join("");

  const layers = SURG_LAYERS.map(l=>`<button class="ltog st${S.lay[l.id]}" data-layer="${l.id}">
      <span class="lswatch lsw-${l.id}"></span><span class="lname">${L(l.n)}</span>
      <span class="lstate">${t("layState")[S.lay[l.id]]}</span></button>`).join("");

  const steps = SURG_STEPS.map((s,i)=>`<div class="sstep${i===S.surgStep?" on":i<S.surgStep?" done":""}">
      <span class="n">${i<S.surgStep?"✓":i+1}</span><span>${L(s.t)}</span></div>`).join("");

  const log = S.log.length ? S.log.map(e=>`<div class="lg ${e.k}">${e.m}</div>`).join("")
    : `<div class="lg muted">${t("logEmpty")}</div>`;

  const fmin = st?st.f[0]:0, fmax = st?st.f[1]:100;

  return `<div class="section-head"><span class="eyebrow">${t("simEyebrow")} · ${t("phaseMid")}</span>
    <h2>${t("simTitle")}</h2><p class="lead">${t("simLead")}</p></div>
  <div class="banner phase" style="margin-bottom:18px"><div><strong>${t("phaseMid")}.</strong> ${t("simPhase")}</div></div>

  <div class="scases">${cases}</div>

  <div class="sim">
    <div>
      <div class="sstage">
        <div class="stage-tag"><span class="eyebrow">${S.zoom==="room"?t("roomTitle"):t("fieldTitle")}</span>
          <div class="code">${SURG_CASES[0].code}</div></div>
        <button class="zoombtn" data-zoom="1">${S.zoom==="room"?t("zoomIn"):t("zoomOut")}</button>
        <div class="scanvas" id="simCanvas">${S.zoom==="room"?surgRoomSVG():surgFieldSVG()}</div>
      </div>

const OPEN_TF = {skin:104, fascia:86, muscle:68};
function applySim(){
  if(S.zoom!=="field") return;
  SURG_LAYERS.forEach(l=>{
    const g = document.getElementById("sx-"+l.id);
    if(g) g.setAttribute("opacity", S.lay[l.id]===2?"1":S.lay[l.id]===1?"0.24":"0");
  });
  ["skin","fascia","muscle"].forEach(k=>{
    const d = S.sopen.indexOf(k)>=0 ? OPEN_TF[k] : 0;
    const a = document.getElementById("sx-"+k+"-l"), b = document.getElementById("sx-"+k+"-r");
    if(a) a.setAttribute("transform","translate("+(-d)+",0)");
    if(b) b.setAttribute("transform","translate("+d+",0)");
  });
  const shown = S.surgStep<SURG_STEPS.length ? (SURG_STEPS[S.surgStep].show||[]) : (SURG_STEPS[SURG_STEPS.length-1].show||[]);
  document.querySelectorAll(".ilyr").forEach(g=>{
    g.setAttribute("opacity", (S.shown.indexOf(g.id)>=0 || shown.indexOf(g.id)>=0) ? "1" : "0");
  });
  const tgt = document.getElementById("sx-target");
  if(tgt){
    if(S.surgStep>=SURG_STEPS.length){ tgt.setAttribute("opacity","0"); }
    else {
      const p = SURG_STEPS[S.surgStep].tgt;
      tgt.setAttribute("opacity","1");
      [["sx-tg-c",p.r],["sx-tg-p",p.r]].forEach(([id,r])=>{
        const c=document.getElementById(id);
        if(c){ c.setAttribute("cx",p.x); c.setAttribute("cy",p.y); c.setAttribute("r",r); }
      });
      const x=document.getElementById("sx-tg-x");
      if(x) x.setAttribute("d","M"+(p.x-8)+","+p.y+" L"+(p.x+8)+","+p.y+" M"+p.x+","+(p.y-8)+" L"+p.x+","+(p.y+8));
    }
  }
}
function simLog(kind, msg){
  S.log.unshift({k:kind, m:msg});
  if(S.log.length>5) S.log.pop();
}
function simReset(){
  S.surgStep=0; S.sopen=[]; S.shown=[]; S.comps=0; S.misses=0; S.log=[];
  S.lay={skin:2,fascia:2,muscle:2,nv:1,bone:2,implant:2};
  S.instr=null; S.force=12; S.zoom="room";
}
function simAct(){
  if(S.surgStep>=SURG_STEPS.length) return;
  if(S.zoom!=="field"){ simLog("warn", t("msgZoom")); repaintView(); return; }
  const st = SURG_STEPS[S.surgStep];
  if(!S.instr){ simLog("warn", t("msgNoInstr")); repaintView(); return; }
  if(S.instr !== st.inst){
    S.misses++;
    simLog("bad", t("msgWrong").replace("{a}", L(INSTR(S.instr).n)).replace("{b}", L(INSTR(st.inst).n)));
    repaintView(); return;
  }
  if(S.force < st.f[0]){ S.misses++; simLog("warn", L(st.lo)+" ("+S.force+" N · "+t("needs")+" "+st.f[0]+"–"+st.f[1]+" N)"); repaintView(); return; }
  if(S.force > st.f[1]){ S.comps++; simLog("bad", L(st.hi)+" ("+S.force+" N · "+t("needs")+" "+st.f[0]+"–"+st.f[1]+" N)"); repaintView(); return; }
  (st.open||[]).forEach(k=>{ if(S.sopen.indexOf(k)<0) S.sopen.push(k); });
  (st.show||[]).forEach(k=>{ if(S.shown.indexOf(k)<0) S.shown.push(k); });
  simLog("good", (S.surgStep+1)+". "+L(st.ok));
  S.surgStep++;
  if(S.surgStep<SURG_STEPS.length){
    S.shown = (SURG_STEPS[S.surgStep].show||[]).slice();
    const nf = SURG_STEPS[S.surgStep].f;
    S.force = Math.round((nf[0]+nf[1])/2);
    S.instr = null;
  }
  repaintView();
}

const AO_LAYERS = ["frac","incision","lag","plate","dcs","screws","arrows","table"];
function applyAO(){
  const st = AO_STEPS[S.aoStep].st;
  AO_LAYERS.forEach(l=>{
    const g = document.getElementById("ao-"+l);
    if(g) g.setAttribute("opacity", st.show.includes(l) ? "1" : "0");
  });
  const dist = document.getElementById("ao-dist");
  if(dist) dist.setAttribute("transform", st.disp ? "translate(11,15) rotate(7 150 450)" : "translate(0,0) rotate(0 150 450)");
}
function applyHeroLayers(){
  const f = document.getElementById("hero-frac");
  if(f) f.setAttribute("opacity","1");
  const d = document.getElementById("hero-dist");
  if(d) d.setAttribute("transform","translate(9,12) rotate(5 150 450)");
}
function setStep(i){
  S.aoStep = Math.max(0, Math.min(AO_STEPS.length-1, i));
  const st = AO_STEPS[S.aoStep];
  document.querySelectorAll(".tstep").forEach((b,j)=>{
    b.className = "tstep" + (j===S.aoStep?" on":j<S.aoStep?" done":"");
  });
  const note = document.getElementById("aoNote");
  if(note) note.innerHTML = L(st.n);
  const prin = document.getElementById("aoPrin");
  if(prin) prin.textContent = t("principle") + " · " + L(st.p);
  const tag = document.querySelector(".stage-tag .eyebrow");
  if(tag) tag.textContent = t("aoStep") + " " + (S.aoStep+1) + " / " + AO_STEPS.length;
  applyAO();
}
function togglePlay(){
  if(S.playing){ clearInterval(S.playing); S.playing=null; }
  else {
    if(S.aoStep >= AO_STEPS.length-1) setStep(0);
    S.playing = setInterval(()=>{
      if(S.aoStep >= AO_STEPS.length-1){ clearInterval(S.playing); S.playing=null; updatePlayLabel(); return; }
      setStep(S.aoStep+1);
    }, 2600);
  }
  updatePlayLabel();
}
function updatePlayLabel(){
  const b = document.querySelector('[data-ao="play"]');
  if(b) b.textContent = S.playing ? t("stop") : t("play");
}

/* ---------------- MECHANISM ---------------- */
function applyMech(){
  const m = MECH[S.open]; if(!m) return;
  const sc = m.stages[S.mechStage]; if(!sc) return;
  MECH_LAYERS.forEach(id=>{ const g=document.getElementById(id); if(g) g.setAttribute("opacity", sc.show.includes(id)?"1":"0"); });
  MECH_MOVERS.forEach(id=>{ const g=document.getElementById(id); if(g) g.setAttribute("transform", (sc.tf&&sc.tf[id])||"translate(0,0)"); });
  const ti=document.getElementById("mechTitle"); if(ti) ti.textContent=L(sc.t);
  const no=document.getElementById("mechNote"); if(no){ const sp=no.querySelector("span"); if(sp) sp.textContent=L(sc.d); }
  const tag=document.querySelector(".mstage .stage-tag .eyebrow");
  if(tag) tag.textContent = t("mechScene")+" "+(S.mechStage+1)+" / "+m.stages.length;
  document.querySelectorAll(".mscene").forEach((b,i)=>b.classList.toggle("on", i===S.mechStage));
}
function setMech(i){
  const m = MECH[S.open]; if(!m) return;
  S.mechStage = Math.max(0, Math.min(m.stages.length-1, i));
  applyMech();
}
function mechPlayLabel(){
  const b = document.querySelector('[data-mech="play"]');
  if(b) b.textContent = S.mechPlay ? t("stop") : t("play");
}
function stopMech(){ if(S.mechPlay){ clearInterval(S.mechPlay); S.mechPlay=null; } }
function toggleMechPlay(){
  const m = MECH[S.open]; if(!m) return;
  if(S.mechPlay){ stopMech(); }
  else {
    if(S.mechStage >= m.stages.length-1) setMech(0);
    S.mechPlay = setInterval(()=>{
      if(S.mechStage >= m.stages.length-1){ stopMech(); mechPlayLabel(); return; }
      setMech(S.mechStage+1);
    }, 3000);
  }
  mechPlayLabel();
}

/* ---------------- EXAM ---------------- */
function markSeg(){
  document.querySelectorAll(".seg").forEach(g=>{
    g.classList.toggle("on", g.dataset.seg===S.seg);
  });
}

/* ---------------- AI SIMULATION ---------------- */
function runPipeline(){
  const steps = t("pipeline");
  const dur = [900,1500,1400,1100,700];
  let i = 0, acc = 0;
  const total = dur.reduce((a,b)=>a+b,0);
  const bar = document.getElementById("aiBar");
  const advance = () => {
    if(i>0){ const prev=document.getElementById("pr"+(i-1)); if(prev){prev.className="pipe-row done"; prev.querySelector(".t").textContent="✓";} }
    if(i>=steps.length){ S.ai="done"; repaintView(); return; }
    const row = document.getElementById("pr"+i);
    if(row) row.className = "pipe-row active";
    acc += dur[i];
    if(bar) bar.style.width = Math.round(acc/total*100) + "%";
    S.aiTimer = setTimeout(()=>{ i++; advance(); }, dur[i]);
  };
  advance();
}

/* ---------------- EVENTS ---------------- */
document.addEventListener("click", e=>{
  const el = t => e.target.closest(t);
  let n;
  if(n = el("[data-lang]")){ LANG = n.dataset.lang; stopMech(); render(); return; }
  if(n = el("[data-go]")){
    if(S.playing){ clearInterval(S.playing); S.playing=null; }
    stopMech();
    S.view = n.dataset.go; S.open=null; S.tab=0; render(); return;
  }
  if(n = el("[data-region]")){ S.region = n.dataset.region; repaintView(); return; }
  if(n = el("[data-kind]")){ S.kind = n.dataset.kind; repaintView(); return; }
  if(n = el("[data-full]")){ S.fullOnly = !S.fullOnly; repaintView(); return; }
  if(n = el("[data-path]")){ stopMech(); S.open = n.dataset.path; S.tab = 0; S.mechStage = 0; repaintView(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(n = el("[data-back]")){ stopMech(); S.open = null; repaintView(); return; }
  if(n = el("[data-tab]")){ if(+n.dataset.tab!==1) stopMech(); S.tab = +n.dataset.tab; repaintView(); return; }
  if(n = el("[data-mstage]")){ stopMech(); mechPlayLabel(); setMech(+n.dataset.mstage); return; }
  if(n = el("[data-mech]")){
    const a = n.dataset.mech;
    if(a==="play") toggleMechPlay();
    else { stopMech(); mechPlayLabel(); setMech(S.mechStage + (a==="next"?1:-1)); }
    return;
  }
  if(n = el(".seg")){ S.seg = n.dataset.seg; repaintView(); return; }
  if(n = el("[data-step]")){ if(S.playing){clearInterval(S.playing);S.playing=null;updatePlayLabel();} setStep(+n.dataset.step); return; }
  if(n = el("[data-ao]")){
    const a = n.dataset.ao;
    if(a==="play") togglePlay();
    else { if(S.playing){clearInterval(S.playing);S.playing=null;updatePlayLabel();} setStep(S.aoStep + (a==="next"?1:-1)); }
    return;
  }
  if(n = el("[data-zoom]") || el("#sx-field-hot")){ S.zoom = S.zoom==="room"?"field":"room"; repaintView(); return; }
  if(n = el("[data-layer]")){ const k=n.dataset.layer; S.lay[k]=(S.lay[k]+2)%3; repaintView(); return; }
  if(n = el("[data-instr]")){ S.instr = (S.instr===n.dataset.instr)?null:n.dataset.instr; repaintView(); return; }
  if(n = el("[data-sact]") || el("#sx-target")){ simAct(); return; }
  if(n = el("[data-sreset]")){ simReset(); repaintView(); return; }
  if(n = el("[data-scase]")){ S.surgCase = n.dataset.scase; repaintView(); return; }
  if(n = el("[data-case]")){
    S.aiCase = AI_CASES.find(c=>c.id===n.dataset.case); S.ai="running"; repaintView(); return;
  }
  if(n = el("[data-reset]")){ clearTimeout(S.aiTimer); S.ai="idle"; S.aiCase=null; repaintView(); return; }
});

document.addEventListener("input", e=>{
  if(e.target && e.target.id==="fSlider"){
    S.force = +e.target.value;
    const v = document.getElementById("fVal");
    if(v) v.textContent = S.force;
  }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Enter" || e.key===" "){
    const g = e.target.closest && e.target.closest(".seg");
    if(g){ e.preventDefault(); S.seg = g.dataset.seg; repaintView(); }
  }
  if(S.view==="ao" && !S.open){
    if(e.key==="ArrowRight") setStep(S.aoStep+1);
    if(e.key==="ArrowLeft") setStep(S.aoStep-1);
  }
});

/* drag and drop on the AI module — always opens the first demo case */
document.addEventListener("dragover", e=>{
  const d = e.target.closest && e.target.closest("#drop");
  if(d){ e.preventDefault(); d.classList.add("hot"); }
});
document.addEventListener("dragleave", e=>{
  const d = e.target.closest && e.target.closest("#drop");
  if(d) d.classList.remove("hot");
});
document.addEventListener("drop", e=>{
  const d = e.target.closest && e.target.closest("#drop");
  if(d){ e.preventDefault(); d.classList.remove("hot"); S.aiCase = AI_CASES[0]; S.ai="running"; repaintView(); }
});

render();

</script>
</body>
</html>
