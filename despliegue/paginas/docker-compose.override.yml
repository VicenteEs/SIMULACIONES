# TraumaHub en el servidor de `paginas/`, junto a las demás páginas.
#
# Se copia como `docker-compose.override.yml` dentro del clon. Docker Compose lo
# fusiona solo con el `docker-compose.yml` del repositorio —que en desarrollo
# levanta únicamente PostgreSQL—, de modo que:
#
#   · `start-all.sh` y `auto-update.sh` de ese servidor siguen funcionando sin
#     tocarlos: los dos hacen `docker compose up -d` sobre la carpeta y la
#     fusión ocurre sola;
#   · `git pull --ff-only` nunca choca, porque este archivo no está versionado
#     dentro del clon (lo ignora .gitignore).
#
# Instalación:
#   cd /home/chesscore/Escritorio/paginas
#   git clone git@github.com:VicenteEs/SIMULACIONES.git traumahub
#   cd traumahub
#   cp despliegue/paginas/docker-compose.override.yml .
#   cp despliegue/paginas/env.ejemplo .env   # y completar los secretos
#   docker compose up -d --build
#
# Después hay que dar de alta la ruta /traumahub en Nginx Proxy Manager
# apuntando a http://traumahub:3000 (ver despliegue/paginas/LEEME.md).

services:
  db:
    # El resto lo hereda del docker-compose.yml del repositorio.
    environment:
      # Sin esto, un volcado con acentos puede restaurarse mal en otra máquina.
      LANG: es_ES.UTF-8
    logging: &registro
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # El prefijo se incrusta al compilar. Cambiarlo exige reconstruir.
        #
        # Sale del .env del anfitrión y no se escribe aquí (D-383): con el valor
        # fijo, Contabo —en la raíz desde E2 de P-016— tenía que editar su copia,
        # y `salud.sh`, que exige la copia exacta de esta plantilla, le pedía
        # volver a copiarla, es decir, recompilar con `/traumahub`. Sin la
        # variable vale `/traumahub`, que es ved. Con `BASE_PATH=` vacío en el
        # .env, la raíz. Va con `-` y no con `:-` porque vacío tiene que querer
        # decir vacío, no «el de siempre».
        BASE_PATH: ${BASE_PATH-/traumahub}
    image: traumahub:local
    container_name: traumahub-app
    restart: unless-stopped
    # La aplicación ya corre sin root (`USER nextjs`) y en el puerto 3000, así
    # que no usa ninguna capacidad del núcleo ni necesita ganar privilegios.
    # Quitárselo todo no le cambia nada a ella; le cambia a quien consiga
    # ejecutar algo dentro —`sharp` abre imágenes que suben los editores—, que
    # se encuentra sin binarios setuid que valgan y sin capacidades que heredar.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # El usuario de la imagen (1001) con el GRUPO de la carpeta de respaldos del
    # anfitrión. `./backups` la crean los guiones del anfitrión —respaldar.sh,
    # deploy.sh— como el usuario que los lanza y con permisos 770: el 1001 de la
    # imagen quedaba fuera y «Respaldar ahora» fallaba con `EACCES` mientras la
    # página de sistema decía «no hay ningún respaldo» (O-067). La receta de
    # antes era un `sudo chown 1001` a mano que nadie comprueba y que se pierde
    # en cuanto algo vuelve a crear la carpeta; con el grupo, cualquier carpeta
    # que cree ese usuario sirve. Y lo que escribe la aplicación sale con ese
    # grupo, que es por donde `restaurar.sh` lo lee desde fuera.
    #
    # `RESPALDOS_GID` es el `id -g` de quien lanza los guiones; en `ved`, 1000.
    # El volumen de medios y lo que trae la imagen siguen siendo del 1001, que
    # sigue siendo el dueño: no cambia nada más.
    user: "1001:${RESPALDOS_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-trauma}:${POSTGRES_PASSWORD:?falta}@db:5432/${POSTGRES_DB:-trauma}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?falta}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?falta}
      NODE_ENV: production
      TZ: ${TZ:-America/Santiago}
      RESPALDOS_DIR: /backups
      # La llave pública de age con que se cifran los respaldos (D-295). La
      # leen del .env los guiones del anfitrión; el contenedor solo la ve si se
      # le pasa aquí, y sin ella «Respaldar ahora» escribiría en claro mientras
      # el respaldo de cada noche cifra. `salud.sh` avisa si se separan.
      RESPALDOS_DESTINATARIO: ${RESPALDOS_DESTINATARIO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_DESDE: ${SMTP_DESDE:-}
      # Estas dos faltaban: el contenedor solo ve lo que se le pasa aquí, así
      # que ponerlas en el .env no servía de nada. No se notó porque el nombre
      # por omisión de `payload.config.ts` coincide con el que se quería.
      SMTP_NOMBRE: ${SMTP_NOMBRE:-TraumaHub}
      DIFUSION_CORREOS_POR_HORA: ${DIFUSION_CORREOS_POR_HORA:-}
      # La franja «Servidor de pruebas» en lo alto de cada página (D-385). En
      # ved, su .env dice la dirección de producción a la que lleva la franja;
      # en Contabo no está, y no sale. Como las dos de arriba: sin esta línea,
      # ponerla en el .env no haría nada.
      SERVIDOR_DE_PRUEBAS: ${SERVIDOR_DE_PRUEBAS:-}
      # Cuántos procesos de la aplicación (D-393). Vacía, los núcleos menos dos
      # y como mucho cuatro (`scripts/arrancar.mjs`); `PROCESOS=1` deja uno
      # solo, como antes.
      PROCESOS: ${PROCESOS:-}
      # El monitoreo (P-016 E7, D-408). Vacías en ved y en cualquier servidor
      # sin `scripts/preparar-monitoreo.sh`: la pestaña «Monitoreo» dice
      # entonces qué falta y las páginas no llevan el contador de visitas.
      # `UMAMI_SITIO` y `UMAMI_CLAVE` las escribe ese guion; `CLOUDFLARE_TOKEN`
      # y `CLOUDFLARE_ZONA`, el dueño, con un token de solo lectura.
      UMAMI_SITIO: ${UMAMI_SITIO:-}
      UMAMI_CLAVE: ${UMAMI_CLAVE:-}
      CLOUDFLARE_TOKEN: ${CLOUDFLARE_TOKEN:-}
      CLOUDFLARE_ZONA: ${CLOUDFLARE_ZONA:-}
      ESTADO_DIR: /estado
    volumes:
      # Los archivos subidos sobreviven a cada despliegue.
      - medios:/app/medios
      # Los respaldos, fuera del contenedor: los ve el panel y los ve el cron.
      - ./backups:/backups
      # La foto del servidor que deja cada minuto el cron del anfitrión
      # (`scripts/estado-del-servidor.sh`). De solo lectura: la aplicación no
      # habla con Docker ni ve el anfitrión, solo lee lo que el guion quiso
      # escribir. Darle el socket de Docker para que mirara ella misma habría
      # sido darle el servidor entero (D-408).
      - ./estado:/estado:ro
    # No se publica ningún puerto en el anfitrión: la única entrada es el proxy,
    # igual que las demás páginas de este servidor.
    networks:
      default: {}
      proxy:
        aliases:
          - traumahub
    logging: *registro

  # Umami, el contador de visitas (P-016 E7, D-408), y su base. Solo con el
  # perfil `monitoreo`, que enciende `COMPOSE_PROFILES=monitoreo` en el .env:
  # así esta plantilla sigue siendo una sola para ved y para Contabo, como
  # exige `salud.sh`, y solo la producción levanta los dos contenedores.
  #
  # Ninguno publica puerto ni está en la red `proxy`: el túnel no los ve. Las
  # visitas entran por la aplicación (`/api/visitas/…`), que las limpia antes
  # de pasárselas, y lo que cuentan se mira en la pestaña «Monitoreo» del
  # panel. La aplicación no depende de ellos (`depends_on`): si Umami cae, se
  # deja de contar, y nada más.
  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    container_name: traumahub-umami
    profiles: [monitoreo]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      # Con `:-` y no con `:?falta`: Compose sustituye las variables de todo el
      # archivo antes de mirar los perfiles, y en ved, que no tiene estas
      # claves, un `:?` tumbaba también la aplicación. Sin ellas, la base de
      # Umami se niega a arrancar (no inicia sin contraseña) y Umami con ella.
      DATABASE_URL: postgresql://umami:${UMAMI_DB_CLAVE:-}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_SECRETO:-}
      # La IP de cada visita la pone la aplicación en esta cabecera; sin ella
      # Umami vería la del contenedor de la aplicación y todas las visitas
      # serían la misma persona. Umami no la guarda: la mezcla con el
      # navegador y una sal que cambia cada mes para distinguir visitantes.
      CLIENT_IP_HEADER: x-ip-de-la-visita
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      TZ: ${TZ:-America/Santiago}
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [default]
    logging: *registro

  umami-db:
    image: postgres:17-alpine
    container_name: traumahub-umami-db
    profiles: [monitoreo]
    restart: unless-stopped
    # Aparte de la base de TraumaHub y no una base más dentro de ella: la
    # cuenta de Umami no alcanza ni a ver los datos de la plataforma, y los
    # respaldos de cada noche siguen siendo solo de la plataforma.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_CLAVE:-}
      POSTGRES_DB: umami
      LANG: es_ES.UTF-8
    volumes:
      - umami-datos:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [default]
    logging: *registro

volumes:
  medios:
  umami-datos:

networks:
  proxy:
    external: true
