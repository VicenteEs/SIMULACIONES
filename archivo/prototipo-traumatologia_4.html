<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma docente de traumatología — prototipo</title>
<style>
:root{
  --ink:#0E1519;
  --ink-2:#1B2A31;
  --slate:#43575F;
  --mute:#7A8D95;
  --paper:#EDF1F2;
  --surface:#FFFFFF;
  --bone:#F7F5F0;
  --line:#D9DFE1;
  --line-soft:#E8ECED;
  --drape:#186B78;
  --drape-deep:#0C424B;
  --drape-tint:#E2EEEF;
  --amber:#9E7526;
  --amber-tint:#F5EEDF;
  --alert:#9E2E27;
  --alert-tint:#F7E9E7;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --r:4px;
  --r-lg:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--drape);outline-offset:2px;border-radius:2px}

/* ---------- typographic roles ---------- */
.eyebrow{
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--mute);
  font-weight:600;
}
.code{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.04em;
  font-weight:600;
}
h1,h2,h3,h4{margin:0;letter-spacing:-.022em;font-weight:650}
h1{font-size:40px;line-height:1.08}
h2{font-size:24px;line-height:1.2}
h3{font-size:17px;line-height:1.3}
h4{font-size:14px;line-height:1.35}
p{margin:0 0 12px}
.lead{font-size:17px;color:var(--slate);line-height:1.6}
.muted{color:var(--mute)}
.small{font-size:13px;color:var(--slate)}

/* ---------- app frame ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;
  height:58px;padding:0 22px;
  background:var(--ink);
  color:#EAF0F1;
  border-bottom:1px solid #000;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:650;letter-spacing:-.02em}
.brand-mark{width:26px;height:26px;flex:none}
.brand-sub{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7FA6AC;display:block;font-weight:500;margin-top:-2px}
.chip-proto{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid #3E5A61;color:#9FC0C5;padding:3px 8px;border-radius:100px;
}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid #3E5A61;border-radius:100px;overflow:hidden}
.lang button{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;font-weight:600;
  padding:5px 11px;color:#9FC0C5;
}
.lang button.on{background:var(--drape);color:#fff}

.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 58px)}
.rail{
  border-right:1px solid var(--line);
  background:var(--surface);
  padding:18px 12px;
  position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;
}
.rail-label{padding:0 10px 10px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 10px;border-radius:var(--r);
  color:var(--slate);text-align:left;font-size:14px;font-weight:500;
  transition:background .14s ease,color .14s ease;
}
.nav-item:hover{background:var(--paper);color:var(--ink)}
.nav-item.on{background:var(--drape-tint);color:var(--drape-deep);font-weight:600}
.nav-item svg{flex:none;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.rail-foot{margin-top:22px;padding:12px 10px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--mute);line-height:1.5}

.main{padding:34px 40px 80px;max-width:1180px}
.view{display:none}
.view.on{display:block;animation:rise .32s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- generic surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:20px 22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.section-head{margin:0 0 18px}
.section-head h2{margin-top:6px}
.section-head p{margin-top:8px;max-width:70ch}
hr.rule{border:none;border-top:1px solid var(--line-soft);margin:26px 0}

.tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:100px;border:1px solid var(--line);color:var(--slate);background:var(--surface);
}
.tag.aocode{border-color:var(--drape);color:var(--drape-deep);background:var(--drape-tint)}
.tag.kine{border-color:#B9CFA8;color:#4A6B36;background:#EEF4E9}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--drape);color:#fff;font-weight:600;font-size:14px;
  padding:10px 18px;border-radius:var(--r);
  transition:background .15s ease;
}
.btn:hover{background:var(--drape-deep)}
.btn.ghost{background:transparent;color:var(--drape-deep);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--drape-tint);border-color:var(--drape)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.banner{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--alert-tint);border:1px solid #E3C4C1;border-left:3px solid var(--alert);
  border-radius:var(--r);padding:12px 14px;font-size:13px;color:#5E1E19;
}
.banner strong{color:var(--alert)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;margin-bottom:40px}
.hero h1{margin:14px 0 16px;max-width:15ch}
.hero-stage{
  background:var(--ink);border-radius:var(--r-lg);padding:18px;
  position:relative;overflow:hidden;min-height:330px;
  display:flex;align-items:center;justify-content:center;
}
.hero-stage .scanline{
  position:absolute;left:0;right:0;height:1px;background:rgba(126,196,204,.5);
  animation:scan 5.5s ease-in-out infinite;
}
@keyframes scan{0%{top:8%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:92%;opacity:0}}
.hero-caption{
  position:absolute;left:18px;bottom:16px;right:18px;
  display:flex;justify-content:space-between;align-items:flex-end;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#6E9298;text-transform:uppercase;
}
.hero-code{
  font-family:var(--mono);font-weight:700;font-size:15px;color:#7EC4CC;letter-spacing:.06em;
  opacity:0;animation:codein 5.5s ease-in-out infinite;
}
@keyframes codein{0%,45%{opacity:0;transform:translateY(4px)}62%,92%{opacity:1;transform:none}100%{opacity:0}}

.mod-card{
  display:block;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px;transition:border-color .16s ease,transform .16s ease,box-shadow .16s ease;
}
.mod-card:hover{border-color:var(--drape);transform:translateY(-2px);box-shadow:0 6px 20px rgba(14,21,25,.07)}
.mod-card .num{font-family:var(--mono);font-size:11px;color:var(--drape);letter-spacing:.1em;font-weight:700}
.mod-card h3{margin:10px 0 7px}
.mod-card p{font-size:13.5px;color:var(--slate);margin:0}
.aud{display:flex;gap:6px;margin-top:13px}

/* ---------- pathology library ---------- */
.lib{display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}
.filters{position:sticky;top:78px}
.filter-group{margin-bottom:20px}
.filter-group .eyebrow{display:block;margin-bottom:8px}
.fbtn{
  display:block;width:100%;text-align:left;padding:6px 10px;border-radius:var(--r);
  font-size:13.5px;color:var(--slate);
}
.fbtn:hover{background:var(--surface)}
.fbtn.on{background:var(--ink);color:#fff;font-weight:600}

.path-card{
  display:block;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 18px;transition:border-color .15s ease,box-shadow .15s ease;
}
.path-card:hover{border-color:var(--drape);box-shadow:0 4px 14px rgba(14,21,25,.06)}
.path-card h3{margin:9px 0 5px;font-size:15.5px}
.path-card .st{font-size:12.5px;color:var(--mute)}
.path-card.stub{background:transparent;border-style:dashed;box-shadow:none}
.path-card.stub h3{color:var(--slate);font-weight:550}

/* ---------- pathology detail ---------- */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:var(--mute)}
.crumb button{color:var(--drape-deep);font-weight:600}
.crumb button:hover{text-decoration:underline}
.detail-head{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 24px;overflow-x:auto}
.tab{
  padding:12px 16px;font-size:13.5px;font-weight:550;color:var(--slate);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--drape-deep);border-bottom-color:var(--drape);font-weight:650}
.tabpane{display:none}
.tabpane.on{display:block}
.prose{max-width:78ch}
.prose h4{margin:22px 0 8px;color:var(--ink-2)}
.prose ul{margin:0 0 14px;padding-left:20px}
.prose li{margin-bottom:6px;color:var(--slate)}
.prose li b,.prose p b{color:var(--ink)}
.prose p{color:var(--slate)}
.classbox{background:var(--bone);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0 18px}
.classbox .code{color:var(--drape-deep)}
.classrow{display:flex;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.classrow:last-child{border-bottom:none}
.classrow .k{flex:none;width:78px}
.classrow .v{font-size:13.5px;color:var(--slate)}

/* rehab phases */
.phase{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:18px 0;border-top:1px solid var(--line-soft)}
.phase:first-of-type{border-top:none}
.phase-when{font-family:var(--mono);font-size:11.5px;color:var(--drape-deep);font-weight:650;letter-spacing:.03em}
.phase h4{margin-bottom:6px}
.crit{background:var(--drape-tint);border-radius:var(--r);padding:10px 12px;margin-top:10px;font-size:13px;color:var(--drape-deep)}
.crit b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}

/* media placeholders */
.media{
  position:relative;background:var(--ink-2);border-radius:var(--r);
  aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
  color:#88A5AC;overflow:hidden;
}
.media::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 8px,transparent 8px 16px);
}
.media-body{text-align:center;z-index:1;padding:12px}
.media-body .play{width:38px;height:38px;border:1.5px solid #6E9298;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.media-body .play svg{width:12px;height:12px;fill:#88A5AC}
.media-body span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.media-cap{font-size:12px;color:var(--mute);margin-top:8px}

/* ---------- physical exam ---------- */
.exam{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:start}
.bodymap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;position:sticky;top:78px}
.bodymap svg{width:100%;height:auto;display:block}
.seg{cursor:pointer;transition:fill .15s ease}
.seg:hover .hit{fill:rgba(24,107,120,.16)}
.seg .hit{fill:transparent}
.seg.on .hit{fill:rgba(24,107,120,.24)}
.seg.on .bone{stroke:var(--drape-deep);stroke-width:2.2}
.bone{fill:var(--bone);stroke:#9FAEB3;stroke-width:1.4;stroke-linejoin:round}
.seglabel{font-family:var(--mono);font-size:7.5px;fill:var(--mute);letter-spacing:.06em}
.maneuver{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.maneuver .m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.maneuver .m-body{padding:14px 16px}
.mrow{display:grid;grid-template-columns:74px 1fr;gap:12px;font-size:13.5px;padding:5px 0}
.mrow .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.mrow .v{color:var(--slate)}

/* ---------- AO 3D ---------- */
.ao{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.stage{
  background:var(--ink);border-radius:var(--r-lg);position:relative;
  min-height:520px;display:flex;align-items:center;justify-content:center;padding:20px;
}
.stage svg{max-height:470px;width:auto}
.stage-tag{position:absolute;top:16px;left:18px}
.stage-tag .code{color:#7EC4CC}
.stage-tag .eyebrow{color:#6E9298}
.stage-note{
  position:absolute;bottom:16px;left:18px;right:18px;
  font-size:12.5px;color:#A8C3C8;background:rgba(255,255,255,.05);
  border:1px solid rgba(126,196,204,.2);border-radius:var(--r);padding:10px 12px;
}
.timeline{display:flex;flex-direction:column}
.tstep{
  display:grid;grid-template-columns:26px 1fr;gap:12px;padding:11px 12px;border-radius:var(--r);
  text-align:left;width:100%;transition:background .14s ease;
}
.tstep:hover{background:var(--surface)}
.tstep.on{background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 12px rgba(14,21,25,.06)}
.tstep .n{
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--mute);
  width:24px;height:24px;border:1px solid var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.tstep.on .n{background:var(--drape);color:#fff;border-color:var(--drape)}
.tstep.done .n{border-color:var(--drape);color:var(--drape-deep)}
.tstep h4{font-size:13.5px;margin-bottom:2px}
.tstep p{font-size:12.5px;color:var(--mute);margin:0}
.principle{
  display:inline-flex;align-items:center;gap:7px;margin-top:8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--amber);background:var(--amber-tint);padding:4px 9px;border-radius:100px;
}
.ao-controls{display:flex;gap:8px;margin-top:14px;align-items:center}

/* ---------- AI module ---------- */
.drop{
  border:1.5px dashed var(--line);border-radius:var(--r-lg);background:var(--surface);
  padding:38px 24px;text-align:center;transition:border-color .16s ease,background .16s ease;
}
.drop.hot{border-color:var(--drape);background:var(--drape-tint)}
.drop svg{width:34px;height:34px;stroke:var(--drape);fill:none;stroke-width:1.4;margin-bottom:12px}
.samples{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.sample{border:1px solid var(--line);border-radius:100px;padding:7px 14px;font-size:13px;color:var(--slate);background:var(--surface)}
.sample:hover{border-color:var(--drape);color:var(--drape-deep)}
.pipe{margin:0}
.pipe-row{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:9px 0;font-size:13.5px;color:var(--mute)}
.pipe-row.active{color:var(--ink)}
.pipe-row.done{color:var(--slate)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);justify-self:center}
.pipe-row.active .dot{background:var(--drape);animation:pulse 1s ease-in-out infinite}
.pipe-row.done .dot{background:var(--drape-deep)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.45);opacity:.55}}
.pipe-row .t{font-family:var(--mono);font-size:11px}
.bar{height:4px;background:var(--line-soft);border-radius:100px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--drape);border-radius:100px;transition:width .5s ease}
.bar.alt span{background:var(--mute)}
.conf{display:grid;grid-template-columns:88px 1fr 46px;gap:12px;align-items:center;padding:7px 0;font-size:13px}
.conf .c{font-family:var(--mono);font-weight:650;color:var(--ink)}
.conf .p{font-family:var(--mono);font-size:12px;color:var(--slate);text-align:right}
.result-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.big-code{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.02em;color:var(--drape-deep)}
.opt{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;background:var(--surface)}
.opt.rec{border-color:var(--drape);box-shadow:inset 3px 0 0 var(--drape)}
.opt h4{margin-bottom:8px}
.opt ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--slate)}
.opt li{margin-bottom:4px}
.pro::marker{color:var(--drape)}
.con::marker{color:var(--alert)}

@media (max-width:1080px){
  .hero{grid-template-columns:1fr}
  .ao{grid-template-columns:1fr}
  .g3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto}
  .rail-label,.rail-foot{display:none}
  .nav-item{width:auto;white-space:nowrap}
  .main{padding:22px 18px 60px}
  .lib,.exam{grid-template-columns:1fr}
  .filters,.bodymap{position:static}
  .g2,.g3{grid-template-columns:1fr}
  h1{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

  name:{es:"Fractura de la diáfisis femoral", en:"Femoral shaft fracture"},
  sub:{es:"Adulto · trazo simple y complejo", en:"Adult · simple and complex patterns"},
  def:{
    es:`<h4>Definición</h4><p>Solución de continuidad del segmento diafisario del fémur, delimitado por el método de los cuadrados de la clasificación AO/OTA. Requiere una energía considerable para producirse en hueso sano, por lo que la fractura debe leerse siempre como el marcador de un traumatismo mayor y no como una lesión aislada.</p>
    <h4>Epidemiología y mecanismo</h4><ul>
    <li><b>Distribución bimodal.</b> Adulto joven por trauma de alta energía (colisión vehicular, caída de altura) y adulto mayor por caída a nivel sobre hueso osteoporótico.</li>
    <li><b>Baja energía en hueso patológico.</b> Obliga a descartar lesión tumoral primaria o secundaria y fractura atípica asociada a bifosfonatos, cuyo trazo es transverso, en cortical lateral y con engrosamiento cortical focal.</li>
    <li><b>Sangrado esperable</b> de 1 a 1,5 litros en el muslo, suficiente para explicar inestabilidad hemodinámica en fracturas bilaterales o expuestas.</li></ul>
    <h4>Lesiones asociadas que se pasan por alto</h4><ul>
    <li>Fractura ipsilateral del cuello femoral, habitualmente de trazo vertical y sin desplazamiento. Se describe hasta en un 9% de las series y es la lesión más frecuentemente omitida en el ingreso.</li>
    <li>Lesión ligamentosa de la rodilla ipsilateral, que solo aparece al reexaminar bajo anestesia o tras la osteosíntesis.</li>
    <li>Fractura expuesta con lesión vascular en el tercio distal, por la relación de la arteria femoral en el hiato de los aductores.</li></ul>`,
    en:`<h4>Definition</h4><p>Disruption of the femoral diaphysis, bounded by the AO/OTA square method. Considerable energy is needed to break healthy bone here, so the fracture should always be read as the marker of a major trauma rather than an isolated injury.</p>
    <h4>Epidemiology and mechanism</h4><ul>
    <li><b>Bimodal distribution.</b> Young adults after high-energy trauma (vehicle collision, fall from height) and older adults after a ground-level fall on osteoporotic bone.</li>
    <li><b>Low energy in pathological bone.</b> Requires ruling out primary or metastatic tumour and atypical bisphosphonate-related fracture, whose pattern is transverse, on the lateral cortex, with focal cortical thickening.</li>
    <li><b>Expected blood loss</b> of 1 to 1.5 litres into the thigh, enough to explain haemodynamic instability in bilateral or open fractures.</li></ul>
    <h4>Associated injuries commonly missed</h4><ul>
    <li>Ipsilateral femoral neck fracture, usually vertical and undisplaced. Reported in up to 9% of series and the injury most often missed on admission.</li>
    <li>Ipsilateral knee ligament injury, which only appears on re-examination under anaesthesia or after fixation.</li>
    <li>Open fracture with vascular injury in the distal third, given the course of the femoral artery through the adductor hiatus.</li></ul>`},
  classif:{

      rows:[
        {k:"32-A", v:{es:"Trazo simple. A1 espiroidea, A2 oblicua (≥30°), A3 transversa (&lt;30°).", en:"Simple pattern. A1 spiral, A2 oblique (≥30°), A3 transverse (&lt;30°)."}},
        {k:"32-B", v:{es:"Fractura en cuña. B2 cuña íntegra, B3 cuña fragmentaria.", en:"Wedge fracture. B2 intact wedge, B3 fragmentary wedge."}},
        {k:"32-C", v:{es:"Fractura multifragmentaria. C2 segmentaria, C3 irregular. Sin contacto entre los fragmentos principales.", en:"Multifragmentary. C2 segmental, C3 irregular. No contact between main fragments."}},
        {k:{es:"Ubicación", en:"Location"}, v:{es:"Calificador de tercio proximal, medio o distal, determinante para elegir el implante y el punto de entrada.", en:"Proximal, middle or distal third qualifier, decisive for implant choice and entry point."}}
      ]

    es:`<h4>Otras clasificaciones útiles</h4><ul>
    <li><b>Winquist y Hansen</b> para el grado de conminución: I fragmento pequeño, II fragmento con al menos 50% de contacto cortical, III fragmento con menos de 50% de contacto, IV segmentaria sin contacto. Orienta la estabilidad rotacional y de longitud y por tanto la necesidad de bloqueo estático.</li>
    <li><b>Gustilo y Anderson</b> en fractura expuesta, con la advertencia de que la clasificación definitiva se establece en pabellón tras el aseo quirúrgico y no en la urgencia.</li></ul>
    <p>La lectura práctica es simple: los trazos A tienen contacto cortical y toleran compresión interfragmentaria; los trazos B y C requieren una estrategia de estabilidad relativa con puenteo del foco.</p>`,
    en:`<h4>Other useful classifications</h4><ul>
    <li><b>Winquist and Hansen</b> for comminution: I small fragment, II fragment with at least 50% cortical contact, III fragment with less than 50% contact, IV segmental with no contact. It guides length and rotational stability and therefore the need for static locking.</li>
    <li><b>Gustilo and Anderson</b> for open fractures, with the caveat that the definitive grade is assigned in theatre after debridement, not in the emergency department.</li></ul>
    <p>The practical reading is simple: A patterns have cortical contact and tolerate interfragmentary compression; B and C patterns call for relative stability bridging the focus.</p>`},
  evalx:{
    es:`<h4>Evaluación inicial</h4><ul>
    <li>Manejo según ATLS. La fractura femoral aislada rara vez explica un shock: buscar otra fuente antes de atribuirle la inestabilidad.</li>
    <li>Inmovilización con férula de tracción, que reduce el sangrado, el dolor y el espasmo del cuádriceps.</li>
    <li>Examen neurovascular distal documentado antes y después de cualquier maniobra de reducción, con índice tobillo-brazo si hay sospecha.</li>
    <li>Síndrome compartimental del muslo: infrecuente pero de alta letalidad si se omite, sobre todo tras aplastamiento o en el paciente anticoagulado.</li></ul>
    <h4>Imágenes</h4><ul>
    <li>Radiografía de fémur completo en dos planos, incluyendo cadera y rodilla en la misma placa.</li>
    <li>Radiografía de pelvis y proyección axial de cadera, más TC de cuello femoral en trauma de alta energía, dirigida a la fractura ipsilateral no desplazada.</li>
    <li>Radiografía del fémur contralateral para plantilla de longitud y rotación cuando el trazo es conminuto.</li></ul>
    <h4>Complicación sistémica</h4><p>El síndrome de embolia grasa aparece entre 24 y 72 horas, con hipoxemia, compromiso de conciencia y petequias en tórax y axila. La estabilización precoz de la fractura reduce su incidencia.</p>`,
    en:`<h4>Initial assessment</h4><ul>
    <li>ATLS-based management. An isolated femoral fracture rarely explains shock: look for another source before attributing instability to it.</li>
    <li>Traction splint immobilisation, which reduces bleeding, pain and quadriceps spasm.</li>
    <li>Documented distal neurovascular examination before and after any reduction manoeuvre, with ankle-brachial index if suspicion exists.</li>
    <li>Thigh compartment syndrome: uncommon but highly damaging if missed, particularly after crush injury or in the anticoagulated patient.</li></ul>
    <h4>Imaging</h4><ul>
    <li>Full-length femur radiographs in two planes, including hip and knee on the same film.</li>
    <li>Pelvic radiograph and axial hip view, plus femoral neck CT in high-energy trauma, aimed at the undisplaced ipsilateral fracture.</li>
    <li>Contralateral femur radiograph as a length and rotation template when the pattern is comminuted.</li></ul>
    <h4>Systemic complication</h4><p>Fat embolism syndrome appears between 24 and 72 hours, with hypoxaemia, altered consciousness and petechiae over chest and axilla. Early fracture stabilisation reduces its incidence.</p>`},
  mgmt:{
    es:`<h4>Estándar actual</h4><p><b>Enclavado endomedular fresado con bloqueo estático</b>, idealmente dentro de las primeras 24 horas en el paciente estable o resucitado. Ofrece estabilidad relativa, permite carga precoz y respeta la biología del foco al no abrirlo.</p>
    <ul><li><b>Anterógrado</b> por punto de entrada piriforme o trocantérico, este último preferido en el paciente obeso y en el tercio proximal.</li>
    <li><b>Retrógrado</b> en fractura del tercio distal, fractura ipsilateral del cuello femoral, fractura bilateral, embarazo, obesidad mórbida o politrauma en que se requiere acceso simultáneo.</li></ul>
    <h4>Cuándo la placa es la mejor decisión</h4><ul>
    <li>Canal endomedular estrecho o deformidad diafisaria previa que impide el paso del clavo.</li>
    <li>Fractura periprotésica o adyacente a un implante existente, donde la placa permite construcciones que puentean toda la zona.</li>
    <li>Fractura del tercio distal con extensión metafisaria, en que la placa condílea o el clavo retrógrado compiten según el trazo.</li>
    <li>Trazo simple espiroideo u oblicuo donde se busca <b>estabilidad absoluta</b> con tornillo interfragmentario y placa de neutralización o compresión.</li></ul>
    <h4>Control de daños</h4><p>En el paciente fisiológicamente inestable, en hipotermia, coagulopatía o acidosis, se indica <b>fijador externo transitorio</b> y conversión a osteosíntesis definitiva una vez recuperado, habitualmente antes de los 14 días para reducir el riesgo de infección del trayecto de los pines.</p>`,
    en:`<h4>Current standard</h4><p><b>Reamed intramedullary nailing with static locking</b>, ideally within the first 24 hours in the stable or resuscitated patient. It provides relative stability, allows early weight-bearing and respects the biology of the focus by not opening it.</p>
    <ul><li><b>Antegrade</b> through a piriformis or trochanteric entry point, the latter preferred in obese patients and in proximal third fractures.</li>
    <li><b>Retrograde</b> in distal third fractures, ipsilateral femoral neck fracture, bilateral fractures, pregnancy, morbid obesity or polytrauma requiring simultaneous access.</li></ul>
    <h4>When plating is the better decision</h4><ul>
    <li>Narrow medullary canal or previous diaphyseal deformity preventing nail passage.</li>
    <li>Periprosthetic fracture or fracture adjacent to existing hardware, where a plate allows constructs bridging the whole zone.</li>
    <li>Distal third fracture with metaphyseal extension, where condylar plate and retrograde nail compete depending on the pattern.</li>
    <li>Simple spiral or oblique pattern where <b>absolute stability</b> is sought with a lag screw plus neutralisation or compression plate.</li></ul>
    <h4>Damage control</h4><p>In the physiologically unstable patient, with hypothermia, coagulopathy or acidosis, <b>temporary external fixation</b> is indicated, converting to definitive fixation once recovered, usually before 14 days to reduce pin-track infection risk.</p>`},
  rehab:{
    intro:{es:"Protocolo orientativo tras enclavado endomedular con bloqueo estático en fractura aislada. Los tiempos se ajustan al trazo, a la calidad ósea y a la estabilidad lograda en pabellón, que el cirujano debe comunicar explícitamente al equipo de rehabilitación.",
